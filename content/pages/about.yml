lead_uk: Бентеги — незалежна театральна компанія в Києві, що працює з критично різними формами — від сучасної драматургії до фізичного театру, хореографії, перформансу й ігрових практик. Театр заснований у 2025 році, з 2026-го має власний репертуарний сезон.
lead_en: Bentegy is an independent theatre company in Kyiv working across sharply different forms, from contemporary drama to physical theatre, choreography, performance and play-based work. Founded in 2025, it has had its own repertoire season since 2026.
mission_uk: Розвивати культуру й мистецтво в Україні — передусім театр і перформативні мистецтва. Створювати умови для молодих митців, нових форм і нових культурних практик.
mission_en: To develop culture and the arts in Ukraine, theatre and the performing arts above all. To create conditions for young artists, new forms and new cultural practices.
# Подія сезону — веде на окрему сторінку /vystavy/naoslip/
naoslip_uk: Вечір незалежного театру, яким Бентеги відкрили свій перший репертуарний сезон. Понад 250 гостей, ескізи нових вистав, розмова театрів із Києва, Харкова, Львова й Луцька та відкритий пітчинг, переможець якого вийшов на прем'єру через 72 дні.
naoslip_en: The evening of independent theatre that opened Bentegy’s first repertoire season. More than 250 guests, sketches of new work, a conversation between theatres from Kyiv, Kharkiv, Lviv and Lutsk, and an open pitch whose winner premiered 72 days later.
# Міжнародна співпраця — пріоритет 2027
intl_uk: |
  Копродукція «Під уніформою» з Qendra Multimedia (Приштина): резиденція в Призрені й показ на Kosovo Theatre Showcase 2026. Бентеги — провідний грантоотримувач консорціуму з чотирьох партнерів у програмі Culture Helps Solidarity Європейської культурної фундації, співфінансованій ЄС.

  З 2027 року театр — партнер проєкту ALIVE «Креативної Європи»: 9 партнерів із 7 країн, координатор — Aeroplio Topos Allou (Афіни). Наш пріоритет на 2027 рік — гастролі, копродукції й міжнародна дистрибуція українських вистав.
intl_en: |
  Under the Uniform is a co-production with Qendra Multimedia (Pristina): a residency in Prizren and a showing at Kosovo Theatre Showcase 2026. Bentegy is lead grant holder of a four-partner consortium in the European Cultural Foundation’s Culture Helps Solidarity programme, co-funded by the EU.

  From 2027 the company is a partner in ALIVE, a Creative Europe cooperation project with 9 partners from 7 countries, led by Aeroplio Topos Allou (Athens). Our priority for 2027 is touring, co-productions and the international distribution of Ukrainian work.
