lead_uk: Бентеги — незалежна театральна компанія в Києві, що працює з критично різними формами — від сучасної драматургії до фізичного театру, хореографії, перформансу й ігрових практик. Театр заснований у 2025 році, з 2026-го має власний репертуарний сезон.
lead_en: Bentegy is an independent theatre company in Kyiv working across sharply different forms, from contemporary drama to physical theatre, choreography, performance and play-based work. Founded in 2025, it has had its own repertoire season since 2026.
mission_uk: Розвивати культуру й мистецтво в Україні — передусім театр і перформативні мистецтва. Створювати умови для молодих митців і нових культурних практик. Давати молоді простір для неформальної та громадянської освіти й змістовної участі в культурі.
mission_en: To develop culture and the arts in Ukraine, theatre and the performing arts above all. To create conditions for young artists and new cultural practices. To give young people space for non-formal and civic education and meaningful cultural participation.
# Фото з процесу: репетиції, читки, підготовка. Показуються на головній і на сторінці «Про театр».
