programmes:
- title_uk: НАОСЛІП
  title_en: NAOSLIP
  image: /uploads/naoslip-talk.jpg
  text_uk: 'Вечір незалежного театру, яким 7 серпня 2026 року Театр Бентеги відкрив свій перший репертуарний сезон у просторі КультМотив. Понад 250 гостей побачили ескізи нових вистав і публічну розмову незалежних театрів із Києва, Харкова, Львова та Луцька — НАШі, Химери, Лава, Гармидер — про умови, в яких працює незалежна сцена. Підґрунтям для розмови стало відкрите опитування «Карта незалежного театру України». Того ж вечора відбувся відкритий пітчинг молодих митців: переможець, «Коні за вікном», вийшов на премʼєру за продюсування Бентег через 72 дні. Партнери: КультМотив, Quests, Distil №9, «Пішли в театр».'
  text_en: 'An evening of independent theatre with which Bentegy Theatre opened its first repertoire season at KultMotyv on 7 August 2026. Around 250 guests saw sketches of new work and a public conversation between independent theatres from Kyiv, Kharkiv, Lviv and Lutsk — NASHi, Khymery, Lava and Harmyder — about the conditions in which the independent scene works. The conversation drew on the open survey “Map of Independent Theatre in Ukraine”. The same evening hosted an open pitch for young artists: the winner, Horses Outside the Window, premiered 72 days later, produced by Bentegy. Partners: KultMotyv, Quests, Distil No9, Pishly v Teatr.'
- title_uk: Тренінги для виконавців
  title_en: Training for performers
  image: /uploads/kinets-zminy-poles.jpg
  text_uk: Практичні заняття з ансамблевих методик Viewpoints і Moment Work для акторів, танцівників і студентів.
  text_en: Practical sessions in Viewpoints and Moment Work for actors, dancers and students.
- title_uk: Міжнародна співпраця
  title_en: International cooperation
  image: /uploads/festival-panel.jpg
  text_uk: Копродукція з Qendra Multimedia (Приштина), резиденція в Міському театрі ім. Бекіма Фехміу в Призрені. Провідний грантоотримувач консорціуму з чотирьох партнерів у програмі Culture Helps Solidarity Європейської культурної фундації, співфінансованій ЄС.
  text_en: A co-production with Qendra Multimedia (Pristina) and a residency at the Bekim Fehmiu City Theatre in Prizren. Lead grant holder of a four-partner consortium in the European Cultural Foundation’s Culture Helps Solidarity programme, co-funded by the EU.
