# Сторінка «Преса»
lead_uk: Матеріали для медіа, фестивалів і партнерів. Тексти й логотипи можна вільно використовувати в публікаціях про театр. Фото до конкретної вистави чи події надсилаємо за запитом на press@bentegy.org.
lead_en: Materials for media, festivals and partners. Texts and logos are free to use in coverage of the company. Photos of a specific production or event are available on request at press@bentegy.org.

about_short_uk: Бентеги — незалежна театральна компанія в Києві, заснована у 2025 році. Театр працює з критично різними формами — від сучасної драматургії до фізичного театру, хореографії, перформансу й ігрових практик — і продюсує молоді незалежні команди.
about_short_en: Bentegy is an independent theatre company in Kyiv, founded in 2025. It works across a wide range of forms, from contemporary drama to physical theatre, choreography, performance and play-based work, and produces work by emerging independent companies.

about_long_uk: |
  Бентеги — незалежна театральна компанія в Києві. Театр заснував продюсер і режисер Павло Коваль у 2025 році; з 2026 року Бентеги мають власний репертуарний сезон, який відкрив вечір незалежного театру НАОСЛІП.

  У репертуарі й продюсерських проєктах Бентег — моновистава «Між світом і душею», «Промова 2.0», яка відбувається в справжньому барі, фізичний і танцювальний театр «Кінець зміни», вистава-ритуал «Коні за вікном» за Матеєм Вішнєком перформативне дослідження гри The Inferior Play і постдокументальна вистава про ЛГБТК+ військових і ветеранів «Під уніформою» (прем'єра 11 грудня 2026, Київ). Над виставами працюють запрошені режисери, хореографи, актори й художники; спільна мова ансамблів — фізичний тренінг, Viewpoints і Moment Work.

  Театр розвиває міжнародну співпрацю: копродукція з Qendra Multimedia (Приштина), резиденція в Призрені та показ на Kosovo Theatre Showcase, участь у програмі Culture Helps Solidarity Європейської культурної фундації. Бентеги також продюсують молоді незалежні команди та студентські роботи й доводять їх до професійної сцени.
about_long_en: |
  Bentegy is an independent theatre company in Kyiv. It was founded by producer and director Pavlo Koval in 2025; since 2026 it has run its own repertory season, which opened with NAOSLIP, an evening of independent theatre.

  The repertoire and produced work include the solo performance Between the World and the Soul, The Speech 2.0, staged in a real working bar, the physical and dance theatre piece End of Shift, the ritual performance Horses Outside the Window after Matei Vișniec, The Inferior Play, a performative study of play, and Under the Uniform, a post-documentary performance about LGBTQ+ soldiers and veterans (premiere 11 December 2026, Kyiv). Guest directors, choreographers, performers and designers make the work; the ensembles share a language of physical training, Viewpoints and Moment Work.

  The company works internationally: a co-production with Qendra Multimedia (Pristina), a residency in Prizren and a showing at Kosovo Theatre Showcase, and participation in the European Cultural Foundation’s Culture Helps Solidarity programme. Bentegy also produces emerging companies and student work, taking it to the professional stage.

