# Сторінка «Преса»
lead_uk: Матеріали для медіа, фестивалів і партнерів. Тексти й логотипи можна вільно використовувати в публікаціях про театр. Фото до конкретної вистави чи події надсилаємо за запитом на press@bentegy.org.
lead_en: Materials for media, festivals and partners. Texts and logos are free to use in coverage of the theatre. Photos of a specific production or event are available on request at press@bentegy.org.

about_short_uk: Бентеги — незалежна театральна компанія в Києві, заснована у 2025 році. Театр працює з критично різними формами — від сучасної драматургії до фізичного театру, хореографії, перформансу й ігрових практик — і продюсує молоді незалежні команди.
about_short_en: Bentegy is an independent theatre company in Kyiv, founded in 2025. It works across sharply different forms, from contemporary drama to physical theatre, choreography, performance and play-based work, and produces young independent companies.

about_long_uk: |
  Бентеги — незалежна театральна компанія в Києві. Театр заснував продюсер і режисер Павло Коваль у 2025 році; з 2026 року Бентеги мають власний репертуарний сезон, який відкрив вечір незалежного театру НАОСЛІП.

  Кожна вистава Бентег шукає власну форму. У репертуарі й продюсерських проєктах — моновистава «Між світом і душею», «Промова 2.0», яка відбувається в справжньому барі, фізичний і танцювальний театр «Кінець зміни», вистава-ритуал «Коні за вікном» за Матеєм Вішнеком і перформативне дослідження гри The Inferior Play. Над виставами працюють запрошені режисери, хореографи, актори й художники; спільна мова ансамблів — фізичний тренінг, Viewpoints і Moment Work.

  Театр розвиває міжнародну співпрацю: копродукція з Qendra Multimedia (Приштина), резиденція в Призрені та показ на Kosovo Theatre Showcase, участь у програмі Culture Helps Solidarity Європейської культурної фундації. Бентеги також продюсують молоді незалежні команди та студентські роботи й доводять їх до професійної сцени.
about_long_en: |
  Bentegy is an independent theatre company in Kyiv. It was founded by producer and director Pavlo Koval in 2025; since 2026 it has had its own repertoire season, opened by NAOSLIP, an evening of independent theatre.

  Every Bentegy production looks for its own form. The repertoire and produced work include the solo performance Between the World and the Soul, The Speech 2.0, staged in a real working bar, the physical and dance theatre piece End of Shift, the ritual performance Horses Outside the Window after Matei Vișniec, and The Inferior Play, a performative study of play. Guest directors, choreographers, performers and designers make the work; the ensembles share a language of physical training, Viewpoints and Moment Work.

  The company develops international cooperation: a co-production with Qendra Multimedia (Pristina), a residency in Prizren and a showing at Kosovo Theatre Showcase, and participation in the European Cultural Foundation’s Culture Helps Solidarity programme. Bentegy also produces young independent companies and student work and brings it to the professional stage.

