    link: naoslip
    role_uk: Куратор, продюсер
    role_en: Curator, producer
    text_uk: "Вечір незалежного театру, що відкрив перший сезон Бентег: перша публічна розмова пʼяти незалежних театрів із Києва, Львова, Харкова й Луцька та відкритий пітчинг молодих команд. 250+ гостей, половина — поза театральною професією."
    text_en: "The evening of independent theatre that opened Bentegy’s first season: the first public conversation between five independent theatres from Kyiv, Lviv, Kharkiv and Lutsk, and an open pitch for emerging companies. 250+ guests, half of them from outside the profession."
