name_uk: Павло Коваль
name_en: Pavlo Koval
role_uk: Театральний продюсер, режисер, драматург. Засновник Театру Бентеги
role_en: Theatre producer, director, playwright. Founder of Bentegy Theatre
photo: /uploads/pavlo-koval.jpg
photo_credit: "Фото: Sergeitsev / Photo: Sergeitsev"
lead_uk: Продюсування — повний цикл, від ідеї до звіту після останнього показу.
lead_en: Producing is the full cycle, from the idea to the report after the final performance.
bio_uk: |
  Театральний продюсер, режисер і драматург із Києва. Працює в культурі з 2019 року, з 2023-го — у театрі. У 2025 році заснував Театр Бентеги.

  Продюсує вистави Бентег і партнерські постановки, молоді незалежні команди та студентські роботи; працював у міжнародних проєктах із La MaMa ETC, CultureHub і Qendra Multimedia. Як режисер працює з документальним і постдраматичним театром. Продакшн-менеджер KÏ Platforma, фелоу ITI Academy Week 2026.
bio_en: |
  Theatre producer, director and playwright based in Kyiv. He has worked in culture since 2019 and in theatre since 2023, and founded Bentegy Theatre in 2025.

  He produces Bentegy’s work and partner productions, young independent companies and student work, and has worked on international projects with La MaMa ETC, CultureHub and Qendra Multimedia. As a director he works with documentary and postdramatic theatre. Production manager at KÏ Platforma, fellow of ITI Academy Week 2026.
services_uk:
  - title: Повний продюсерський цикл
    text: Концепція, кошторис, команда, майданчик, графік показів, звітність.
  - title: Партнерства й фінансування
    text: Гранти, копродукції, міжнародні партнери, домовленості з майданчиками.
  - title: Промо і квитки
    text: Анонси, робота з медіа, продаж квитків, аналітика каси.
  - title: Менторство молодих команд
    text: Супровід студентських і дебютних робіт до професійної сцени.
services_en:
  - title: Full producing cycle
    text: Concept, budget, team, venue, performance schedule, reporting.
  - title: Partnerships and funding
    text: Grants, co-productions, international partners, venue agreements.
  - title: Promotion and ticketing
    text: Announcements, media relations, ticket sales, box-office analytics.
  - title: Mentoring young teams
    text: Taking student and debut work to the professional stage.
