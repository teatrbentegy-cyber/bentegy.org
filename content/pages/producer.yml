vision_uk:
  - title: Документ
    text: Інтервʼю, листи, архіви, особисті свідчення — матеріал, з якого виростає текст.
  - title: Тіло
    text: Метод Тадаші Сузукі, Viewpoints і Moment Work — спільна мова ансамблю.
  - title: Процес
    text: Колективний девайзинг. Вистава складається на репетиціях разом з виконавцями.
  - title: Простір
    text: Індустріальні, підвальні й міські простори як частина драматургії.
vision_en:
  - title: Document
    text: Interviews, letters, archives, personal testimony — the material the text grows from.
  - title: Body
    text: The Suzuki Method, Viewpoints and Moment Work — the ensemble’s shared language.
  - title: Process
    text: Collective devising. The performance is built in rehearsal with the performers.
  - title: Space
    text: Industrial, basement and city spaces as part of the dramaturgy.
