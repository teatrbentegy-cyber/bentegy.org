  - title_uk: Між світом і душею
    title_en: Between the World and the Soul
    year: "2026"
    link: mizh-svitom-i-dusheyu
    text_uk: Документальна моновистава про памʼять, опір і моральний вибір через постать поета й дисидента Василя Стуса. Текст зібрано з його поезії, листів і автобіографічної прози; пластична партитура — за методом Тадаші Сузукі; мінімальна сценографія створена для гастролей.
    text_en: A documentary solo performance about memory, resistance and moral choice through the figure of poet and dissident Vasyl Stus. The text draws on his poetry, letters and autobiographical prose; the physical score on the Suzuki Method; the minimal set is built to tour.
    facts_uk:
      - ["Роль", "Режисер, автор сценарію, продюсер"]
      - ["Продакшн", "Театр Бентеги"]
      - ["Прем'єра", "11 червня 2026, Collider, Київ"]
      - ["Далі", "Розширена версія на 120 хвилин, 15 сцен"]
    facts_en:
      - ["Role", "Director, scriptwriter, producer"]
      - ["Production", "Bentegy Theatre"]
      - ["Premiere", "11 June 2026, Collider, Kyiv"]
      - ["Next", "Extended 120-minute version, 15 scenes"]
  - title_uk: Під уніформою
    title_en: Under the Uniform
    year: "2026–2027"
    link: under-the-uniform
    text_uk: Постдокументальна вистава про людей, яких ми бачимо в уніформі, і про те, що лишається під нею. В основі — інтерв'ю з військовими й ветеранами, переосмислені художньо.
    text_en: A post-documentary performance about the people we see in uniform, and about what remains beneath it. Based on interviews with soldiers and veterans, reimagined as fiction.
