voices:
  - text_uk: Світ дізнається про нього й буде зворушений його роботою.
    text_en: The world will come to know him and be moved by his work.
    author: Malin Nagel
    role_uk: керівниця ITI Academy, Німеччина
    role_en: Head of ITI Academy, Germany
  - text_uk: Чітке відчуття напряму й глибоке розуміння того, яку роботу він хоче робити.
    text_en: A clear sense of direction and a strong understanding of the kind of work he wants to pursue.
    author: Sara Amini
    role_uk: художня керівниця Seemia Theatre, Лондон
    role_en: Artistic Director, Seemia Theatre, London
  - text_uk: Мультидисциплінарний митець із чітким напрямом, організованістю й увагою до деталей.
    text_en: A multidisciplinary artist with clear direction, organisation and attention to detail.
    author: Shauna Harris
    role_uk: акторка, авторка, фасилітаторка, Ірландія
