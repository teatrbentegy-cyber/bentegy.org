scene_uk: |
  Театр Бентеги — незалежний театр у Києві, заснований 2025 року. Працює з різними жанрами й форматами, з 2026-го має власний репертуарний сезон і діє через ГО «В РЕСУРСІ». Моя робота тут — будувати спільноту, підтримувати незалежних митців і розвивати незалежну сцену Києва.
scene_en: |
  Bentegy Theatre is an independent theatre company in Kyiv, founded in 2025. It works across genres and formats, has run its own repertory season since 2026 and operates through the NGO In the Resource. My work here is community building, support for independent artists and the growth of Kyiv’s independent scene.
