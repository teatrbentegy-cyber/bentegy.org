bio_uk: |
  Театральний продюсер, режисер і драматург із Києва, засновник незалежного Театру Бентеги. Як митець працює з документом, свідченням і тілом у постдраматичних формах. Як продюсер будує незалежну сцену Києва: випускає власні роботи, міжнародні копродукції та вистави молодих команд, тримаючи обидві ролі водночас.
bio_en: |
  Theatre producer, director and playwright based in Kyiv, founder of Bentegy Theatre, an independent company. As an artist he works with documents, testimony and the body in postdramatic forms. As a producer he helps build Kyiv’s independent scene, bringing out his own work, international co-productions and work by emerging companies, and holding both roles at once.
