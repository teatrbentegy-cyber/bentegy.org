name_uk: Павло Коваль
name_en: Pavlo Koval
role_uk: Театральний продюсер, режисер, драматург. Засновник Театру Бентеги
role_en: Theatre producer, director, playwright. Founder of Bentegy Theatre
photo: /uploads/pavlo-koval.jpg
photo_credit: "Фото: Sergeitsev / Photo: Sergeitsev"
lead_uk: Продюсування для мене — повний цикл. Від народження ідеї до звіту після останнього показу.
lead_en: For me, producing is the full cycle. From the birth of an idea to the report after the final performance.
bio_uk: |
  Театральний продюсер, режисер і драматург із Києва. Засновник незалежного Театру Бентеги, який працює в документальних, постдраматичних і фізичних формах та створює вистави в альтернативних і індустріальних просторах міста.

  Родом із Камʼянського: перші дві вистави, «Новорічне рандеву» і «Як важко бути актором», випустив там у сімнадцять років. У Києві почав працювати в Експериментальному театральному клубі «НАШі», у 2025 році заснував Театр Бентеги й дебютував виставою «Промова». За кілька років спродюсував і скоординував понад 150 культурних і перформативних подій.

  Як продюсер веде проєкт повністю: концепція, кошторис, команда, майданчик, партнерства, промо, продаж квитків і звітність. Продюсує молоді незалежні команди та студентські роботи й доводить їх до професійної сцени. Як режисер працює з документальним матеріалом, свідченнями й тілом, спирається на метод Тадаші Сузукі, Viewpoints і Moment Work, веде тренінги Viewpoints.

  Продакшн-менеджер KÏ Platforma. Fellow програми ITI Academy Week 2026 Міжнародного театрального інституту. Учасник продюсерської програми фестивалю Sirenos 2026 у Вільнюсі та програми GRADUS II у Пармі й Реджо-Емілії. Випускник Київського національного університету культури і мистецтв (культурологія та івент-менеджмент, 2026).
bio_en: |
  Theatre producer, director and playwright based in Kyiv. Founder of the independent Bentegy Theatre, which works in documentary, postdramatic and physical forms and stages its work in alternative and industrial spaces across the city.

  He comes from Kamianske, where he made his first two productions at the age of seventeen. In Kyiv he started working at the NASHi Experimental Theatre Club, and in 2025 founded Bentegy Theatre, debuting with The Speech (Promova). He has produced and coordinated more than 150 cultural and performative events.

  As a producer he runs the whole cycle: concept, budget, team, venue, partnerships, promotion, ticketing and reporting. He produces young independent teams and student work and brings it to the professional stage. As a director he works with documentary material, testimony and the body, drawing on Tadashi Suzuki’s method, Viewpoints and Moment Work, and leads Viewpoints training.

  Production manager at KÏ Platforma. Fellow of the International Theatre Institute’s ITI Academy Week 2026. Participant in the producers’ programme of the Sirenos 2026 festival in Vilnius and of GRADUS II in Parma and Reggio Emilia. Graduate of the Kyiv National University of Culture and Arts (Cultural Studies and Event Management, 2026).
services_uk:
  - title: Повний продюсерський цикл
    text: Концепція, кошторис, команда, майданчик, графік показів, звітність.
  - title: Партнерства й фінансування
    text: Гранти, копродукції, міжнародні партнери, домовленості з майданчиками.
  - title: Промо і квитки
    text: Анонси, робота з медіа, продаж квитків, аналітика каси.
  - title: Менторство молодих команд
    text: Супровід студентських і дебютних робіт до професійної сцени.
services_en:
  - title: Full producing cycle
    text: Concept, budget, team, venue, performance schedule, reporting.
  - title: Partnerships and funding
    text: Grants, co-productions, international partners, venue agreements.
  - title: Promotion and ticketing
    text: Announcements, media relations, ticket sales, box-office analytics.
  - title: Mentoring young teams
    text: Taking student and debut work to the professional stage.
