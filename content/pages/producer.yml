principles_uk:
  - Однаковий гонорар для кожного учасника копродукції, з якої б країни він не був.
  - Усе, що ми будуємо, повертається до Києва.
  - Після кожної прем'єри — розмова з глядачами й анкета зворотного звʼязку.
principles_en:
  - Equal fees for everyone in a co-production, whatever country they come from.
  - Everything we build comes back to Kyiv.
  - Every premiere is followed by an audience talk and a feedback survey.
flagships:
  - title_uk: Троянські жінки
    title_en: Trojan Women
    year: "2026"
    text_uk: Українська адаптація легендарної вистави La MaMa ETC 1974 року. Вистава говорить вигаданою мовою — інтонацією, голосом, тілом і ритмом, — тож війну, вигнання й колективне горе зрозуміло без перекладу.
    text_en: A Ukrainian adaptation of La MaMa ETC’s legendary 1974 production. The performance speaks an invented language — through intonation, voice, body and rhythm — so war, exile and collective grief need no translation.
