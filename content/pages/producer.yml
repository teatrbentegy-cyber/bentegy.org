name_uk: Павло Коваль
name_en: Pavlo Koval
role_uk: Театральний продюсер, режисер, засновник Театру Бентеги
role_en: Theatre producer, director, founder of Bentegy Theatre
photo: /uploads/pavlo-koval.jpg
photo_credit: "Фото / Photo: Sergeitsev"
lead_uk: Продюсування для мене — повний цикл. Від народження ідеї до звіту після останнього показу.
lead_en: For me, producing is the full cycle. From the birth of an idea to the report after the final performance.
bio_uk: |
  Родом із Камʼянського, де випустив свої перші дві вистави. У Києві почав працювати в театральному клубі «НАШі», а у 2025 році заснував Театр Бентеги й дебютував у місті виставою «Промова».

  Продюсує молоді незалежні команди: допомагає випускати вистави, знаходити партнерів і домовлятися про співпрацю. Як режисер працює в документальних і постдраматичних формах, веде тренінги Viewpoints.

  Продакшн-менеджер KÏ Platforma. Випускник Київського національного університету культури і мистецтв (культурологія та івент-менеджмент, 2026). Fellow програми ITI Academy Week 2026 Міжнародного театрального інституту.
bio_en: |
  Pavlo comes from Kamianske, where he made his first two productions. In Kyiv he started working at the NASHi theatre club, and in 2025 founded Bentegy Theatre, debuting in the city with Promova (The Speech).

  He produces young independent teams, helping them release productions, find partners and secure agreements. As a director he works in documentary and postdramatic forms and leads Viewpoints training.

  Production manager at KÏ Platforma. Graduate of the Kyiv National University of Culture and Arts (Cultural Studies and Event Management, 2026). Fellow of the International Theatre Institute’s ITI Academy Week 2026.
services_uk:
  - title: Повний продюсерський цикл
    text: Концепція, кошторис, команда, майданчик, графік показів, звітність.
  - title: Партнерства й фінансування
    text: Гранти, копродукції, міжнародні партнери, домовленості з майданчиками.
  - title: Промо і квитки
    text: Анонси, робота з медіа, продаж квитків, аналітика каси.
  - title: Менторство молодих команд
    text: Супровід студентських і дебютних робіт до професійної сцени.
services_en:
  - title: Full producing cycle
    text: Concept, budget, team, venue, performance schedule, reporting.
  - title: Partnerships and funding
    text: Grants, co-productions, international partners, venue agreements.
  - title: Promotion and ticketing
    text: Announcements, media relations, ticket sales, box-office analytics.
  - title: Mentoring young teams
    text: Taking student and debut work to the professional stage.
