# Сторінка «Можливості»: відкриті виклики й формати співпраці (ЧЕРНЕТКА, чекає погодження Павла)
lead_uk: "Відкриті виклики для молодих команд, акторів і партнерів: пітчинги, кастинги, копродукції."
lead_en: "Open calls for emerging companies, performers and partners: pitches, castings, co-productions."

# Актуальні виклики. Порожній список — сторінка показує, де їх оголошуємо.
