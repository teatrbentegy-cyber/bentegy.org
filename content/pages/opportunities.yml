# Сторінка «Можливості»: відкриті виклики й формати співпраці (погоджено Павлом 24.11.2026)
lead_uk: "Відкриті виклики для молодих команд, акторів, партнерів і всіх, хто хоче працювати з нами: пітчинги, кастинги, копродукції, стажування й волонтерство."
lead_en: "Open calls for emerging companies, performers, partners and anyone who wants to work with us: pitches, castings, co-productions, internships and volunteering."

# Актуальні виклики. Порожній список — сторінка показує, де їх оголошуємо.
# Поля: title_uk/en, text_uk/en, deadline (РРРР-ММ-ДД), url, button_uk/en
open: []
next_uk: Нові виклики оголошуємо тут і в Instagram.
next_en: New calls are announced here and on Instagram.

formats:
  - title_uk: Відкритий пітчинг
    title_en: Open pitch
    text_uk: Молоді команди презентують свої проєкти зі сцени. Переможець отримує продюсування — майданчик, промо й продаж квитків, менторський супровід. Художні рішення, склад і авторство лишаються за командою.
    text_en: "Emerging companies present their projects on stage. The winner gets producing support: a venue, promotion and ticketing, mentoring. Artistic decisions, casting and authorship stay with the company."
    case_uk: «Коні за вікном» перемогли на пітчингу НАОСЛІП у серпні 2026 року. Від пітчингу до прем'єри минуло 72 дні.
    case_en: Horses Outside the Window won the NAOSLIP pitch in August 2026. The premiere came 72 days later.
    show: koni-za-viknom
    media: koni-za-viknom-premiera
  - title_uk: Кастинги
    title_en: Castings
    text_uk: Кастинги оголошуємо під конкретні вистави. Умови, дати й формат публікуємо в кожному оголошенні.
    text_en: Castings are announced for specific productions, each with its own terms, dates and format.
  - title_uk: Копродукції й резиденції
    title_en: Co-productions and residencies
    text_uk: Робимо вистави разом із театрами й інституціями з інших міст і країн. «Під уніформою» народилася в резиденції Qendra Multimedia в Призрені як копродукція Україна — Косово.
    text_en: "We make work together with theatres and institutions from other cities and countries. Under the Uniform began in a residency with Qendra Multimedia in Prizren, as a Ukraine–Kosovo co-production."
    show: under-the-uniform
  - title_uk: Стажування й волонтерство
    title_en: Internships and volunteering
    text_uk: Долучайтеся до команди на виставах і подіях — у продакшні, роботі з глядачами, промо, фото й відео. Напишіть, що вам цікаво, і ми запросимо на найближчий проєкт.
    text_en: "Join the team at performances and events: in production, front of house, promotion, photo and video. Tell us what interests you, and we will invite you to the next project."
