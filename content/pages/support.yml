uses_uk:
  - title: Нові вистави
    text: Дослідження, репетиції, сценографія, костюми й світло для прем'єр.
  - title: Команда
    text: Гонорари акторів, режисерів, хореографів і художників.
  - title: Покази
    text: Оренда майданчиків, техніка, перевезення декорацій.
  - title: Гастролі
    text: Участь у фестивалях в Україні та за кордоном.
  - title: Молоді команди
    text: Відкриті пітчинги й продюсерська підтримка нових незалежних команд.
uses_en:
  - title: New productions
    text: Research, rehearsals, set, costumes and lighting for premieres.
  - title: The team
    text: Fees for performers, directors, choreographers and designers.
  - title: Performances
    text: Venue hire, technical equipment and set transport.
  - title: Touring
    text: Festival appearances in Ukraine and abroad.
  - title: Emerging companies
    text: Open pitches and producing support for new independent companies.

partners_uk:
  - title: Партнер сезону
    text: Підтримка репертуарного сезону з присутністю бренду в усіх анонсах і на показах.
  - title: Партнер вистави
    text: Внесок у конкретну прем'єру чи гастроль.
  - title: Підтримка в натуральній формі
    text: Майданчик для репетицій, світло й звук, друк, перевезення, проживання для гастролей.
  - title: Меценатство
    text: Особиста підтримка театру з подякою на сайті та в програмках, якщо ви цього бажаєте.
partners_en:
  - title: Season partner
    text: Support for the season, with your brand in every announcement and at every performance.
  - title: Production partner
    text: A contribution to a specific premiere or tour.
  - title: In-kind support
    text: Rehearsal space, lighting and sound, printing, transport, accommodation on tour.
  - title: Patronage
    text: Personal support for the theatre, with thanks on the website and in programmes if you wish.

# Абонемент (погоджено Павлом 24.11.2026): щомісячна підтримка через ті самі сторінки WayForPay (види «Абонемент» з регулярним платежем щомісяця)
abonement:
  title_uk: Абонемент
  title_en: Monthly subscription
  lead_uk: Щомісячна підтримка, на якій тримається сезон. WayForPay списує внесок щомісяця, зупинити можна будь-коли.
  lead_en: Monthly support that keeps the season going. WayForPay charges your gift every month, and you can stop any time.
  levels:
    - title_uk: Гальорка
      title_en: Gallery
      amount_uah: 500
      amount_eur: 15
      text_uk: Звідси видно всю сцену й увесь сезон.
      text_en: From here you see the whole stage and the whole season.
    - title_uk: Партер
      title_en: Stalls
      amount_uah: 1000
      amount_eur: 30
      text_uk: Ближче до сцени й до людей, які її створюють.
      text_en: Closer to the stage and to the people who make it.
    - title_uk: Ложа
      title_en: Box
      amount_uah: 2500
      amount_eur: 60
      text_uk: Найближче коло театру. Тримає сезон на ногах.
      text_en: The theatre’s inner circle. It keeps the season on its feet.
  perks_uk:
    - Щомісяця лист «з-за лаштунків» про те, що відбувається в театрі
    - Раз на квартал звіт, скільки зібрали й на що пішли кошти
    - Раз на сезон запрошення на відкриту репетицію чи прогін
    - Ваше ім'я серед друзів театру на сайті, якщо бажаєте
  perks_en:
    - A monthly letter from backstage about what is happening in the theatre
    - A quarterly report on how much was raised and where it went
    - Once a season, an invitation to an open rehearsal or run-through
    - Your name among the theatre’s friends on the website, if you wish
  button_uk: Оформити абонемент
  button_en: Subscribe monthly
  stop_uk: Щоб зупинити абонемент, напишіть на theatre@bentegy.org, і ми скасуємо списання.
  stop_en: To stop your subscription, write to theatre@bentegy.org and we will cancel the payment.
