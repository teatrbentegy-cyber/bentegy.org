uses_uk:
  - title: Нові вистави
    text: Дослідження, репетиції, сценографія, костюми й світло для прем'єр.
  - title: Команда
    text: Гонорари акторів, режисерів, хореографів і художників.
  - title: Покази
    text: Оренда майданчиків, техніка, перевезення декорацій.
  - title: Гастролі
    text: Участь у фестивалях в Україні та за кордоном.
  - title: Освіта
    text: Тренінги, відкриті пітчинги й продюсерська підтримка молодих команд.
uses_en:
  - title: New productions
    text: Research, rehearsals, set, costumes and lighting for premieres.
  - title: The team
    text: Fees for performers, directors, choreographers and designers.
  - title: Performances
    text: Venue hire, technical equipment and transport for the sets.
  - title: Touring
    text: Festival appearances in Ukraine and abroad.
  - title: Learning
    text: Training, open pitches and producing support for young teams.

partners_uk:
  - title: Партнер сезону
    text: Підтримка репертуарного сезону з присутністю бренду в усіх анонсах і на покажах.
  - title: Партнер вистави
    text: Внесок у конкретну прем'єру чи гастроль.
  - title: Підтримка в натуральній формі
    text: Майданчик для репетицій, світло й звук, друк, перевезення, проживання для гастролей.
  - title: Меценатство
    text: Особиста підтримка театру з подякою на сайті та в програмках, якщо ви цього бажаєте.
partners_en:
  - title: Season partner
    text: Support for the repertoire season, with your brand in every announcement and at every performance.
  - title: Production partner
    text: A contribution to a specific premiere or tour.
  - title: In-kind support
    text: Rehearsal space, lighting and sound, printing, transport, accommodation on tour.
  - title: Patronage
    text: Personal support for the theatre, with thanks on the website and in programmes if you wish.
