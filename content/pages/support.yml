# Сторінка «Підтримати театр»
lead_uk: Бентеги — незалежний театр. Кожен внесок стає новою виставою, чесним гонораром для команди й показом для глядачів.
lead_en: Bentegy is an independent theatre. Every contribution becomes a new production, fair pay for the team and a performance for the audience.

# Онлайн-внесок карткою (WayForPay). Коли буде посилання на платіжну сторінку — вставте його сюди.
online_url: ""
online_note_uk: 'Оплата через WayForPay: Visa, Mastercard, Apple Pay, Google Pay. Внесок отримує ГО «В РЕСУРСІ» як благодійну пожертву на статутну діяльність.'
online_note_en: 'Secure payment via WayForPay: Visa and Mastercard from any country, Apple Pay, Google Pay. Donations go to NGO “In the Resource” as a charitable gift for its statutory activities.'

