# Сторінка «Підтримати театр»
lead_uk: Бентеги — незалежний театр. Кожен внесок стає новою виставою, чесним гонораром для команди й показом для глядачів.
lead_en: Bentegy is an independent theatre company in Kyiv. Every contribution becomes a new production, fair pay for the team and a performance for the audience.

# Онлайн-внесок карткою (WayForPay). Коли буде посилання на платіжну сторінку — вставте його сюди.
online_url: ""
online_note_uk: 'Оплата через WayForPay: Visa, Mastercard, Apple Pay, Google Pay. Внесок отримує ГО «В РЕСУРСІ» як благодійну пожертву на статутну діяльність.'
online_note_en: 'Secure payment via WayForPay: Visa and Mastercard from any country, Apple Pay, Google Pay. Contributions are received by the NGO “In the Resource” as charitable donations for its statutory activities.'

# Мета зверху сторінки: вистава, на яку збираємо зараз (блок support_box з її файлу). Після goal_until — загальний внесок.
goal_production: under-the-uniform
goal_until: 2026-12-11

# Рівні донатів. Посилання — з кабінету WayForPay (Платіжні кнопки). Рівень зʼявляється на сайті, щойно додано посилання:
# гривневе — на українській сторінці, єврове — на англійській.
tiers:
  - amount_uah: 300
    hint: true
    amount_eur: 10
    title_uk: Третій дзвінок
    title_en: Curtain up
    text_uk: Маленький жест, з якого починається вечір. Він допомагає комусь опинитися в залі.
    text_en: The small gesture that starts the evening. It helps someone take their seat.
    url_uah: https://secure.wayforpay.com/donate/bentegy_uah
    url_eur: https://secure.wayforpay.com/donate/bentegy_eur
  - amount_uah: 800
    amount_eur: 20
    title_uk: Вихід на сцену
    title_en: Entrance
    text_uk: Підтримка людей, які виходять до вас на сцену.
    text_en: Support for the people who step out on stage to meet you.
    url_uah: https://secure.wayforpay.com/donate/bentegy_uah
    url_eur: https://secure.wayforpay.com/donate/bentegy_eur
  - amount_uah: 1500
    amount_eur: 35
    title_uk: Світло рампи
    title_en: Footlights
    text_uk: Те, що робить виставу видимою.
    text_en: The light that lets you see the performance.
    url_uah: https://secure.wayforpay.com/donate/bentegy_uah
    url_eur: https://secure.wayforpay.com/donate/bentegy_eur
  - amount_uah: 5000
    hint: true
    amount_eur: 100
    title_uk: Сцена
    title_en: The stage
    text_uk: Третина оренди зали для одного показу.
    text_en: A third of the venue hire for one performance.
    url_uah: https://secure.wayforpay.com/donate/bentegy_uah
    url_eur: https://secure.wayforpay.com/donate/bentegy_eur
  - amount_uah: 15000
    hint: true
    amount_eur: 300
    title_uk: Партнер показу
    title_en: Performance partner
    text_uk: Повна оренда майданчика для одного показу. За бажанням подякуємо вам на сайті й перед виставою.
    text_en: The full venue hire for one performance. If you wish, we will thank you on our website and before the show.
    url_uah: https://secure.wayforpay.com/donate/bentegy_uah
    url_eur: https://secure.wayforpay.com/donate/bentegy_eur
free_url_uah: https://secure.wayforpay.com/donate/bentegy_uah
free_url_eur: https://secure.wayforpay.com/donate/bentegy_eur

