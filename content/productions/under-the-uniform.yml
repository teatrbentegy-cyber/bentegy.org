hook_uk: "Секрет буде. Питання тільки в тому, чий."
hook_en: "There will be a secret. The only question is whose."
description_uk: |
  Сьогодні у програмі шоу з секретом. У ведучого десяток голосів, власні правила вечора й обіцянка розкрити секрет наприкінці.

  Секрет буде. Питання тільки в тому, чий.

  Вистава про людей, яких ми бачимо в уніформі, і про те, що лишається під нею. В основі вистави — інтерв'ю з військовими й ветеранами, переосмислені художньо: на сцені вигадані герої, а в них живе справжній досвід. Це смішна, ніжна й чесна історія про дружбу, повернення додому і любов, для якої досі шукають місце.

  Те, що відбувається у війську, відбувається і поза ним.
description_en: |
  Tonight's programme: a show with a secret. The host has a dozen voices, his own rules for the evening and a promise to reveal the secret at the end.

  There will be a secret. The only question is whose.

  A performance about the people we see in uniform, and about what remains beneath it. It is based on interviews with soldiers and veterans, reimagined as fiction: the characters on stage are invented, and real experience lives in them. A funny, tender and honest story about friendship, coming home, and a love still searching for its place.

  What happens in the army happens beyond it too.
