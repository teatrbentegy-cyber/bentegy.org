summary_uk: Вистава про повернення з війни, створена з глибинних інтервʼю з українськими ветеранами.
summary_en: A performance about coming home from war, built from in-depth interviews with Ukrainian veterans.
description_uk: |
  Вистава про повернення з війни, створена на основі глибинних інтервʼю з українськими ветеранами методом колективного девайзингу, з використанням практик Viewpoints і Moment Work.

  Міжнародна копродукція з Qendra Multimedia (Приштина) за підтримки Європейської культурної фундації в програмі Culture Helps Solidarity. Дати показів зʼявляться в афіші.
description_en: |
  A performance about coming home from war, built from in-depth interviews with Ukrainian veterans and created through collective devising, using Viewpoints and Moment Work.

  An international co-production with Qendra Multimedia (Pristina), supported by the European Cultural Foundation’s Culture Helps Solidarity programme. Performance dates will be announced in the schedule.
