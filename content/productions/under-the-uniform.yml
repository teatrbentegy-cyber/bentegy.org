summary_uk: Вистава з інтерв'ю з ветеранами й військовими про уніформи, які ми носимо, щоб нас прийняли, і про те, що ховаємо під ними.
summary_en: A performance built from interviews with veterans and service members, about the uniforms we wear to be accepted and what we keep underneath.
hook_uk: "Шоу з секретом. Залишайтеся до кінця."
hook_en: "A show with a secret. Stay till the end."
description_uk: |
  Уніформу носить кожен. Костюм для роботи, усмішку для родини, роль, з якою всім довкола спокійно. Деякі уніформи пошиті з тканини. Більшість видно лише зсередини.

  Сьогодні шоу. Ведучий готовий, зал повний, у програмі історії, пісні й той чорний гумор, яким військові діляться тільки між своїми. А наприкінці — секрет.

  «Під уніформою» виросла з інтерв'ю з українськими ветеранами й чинними військовими. Це історія про людей, яких суспільство вшановує як героїв, і про ту їхню частину, яку воно воліє лишати поза увагою: право бути собою і право любити. Те, що відбувається в армії, відбувається всюди. Кожен, хто бодай раз грав роль, щоб його прийняли, впізнає себе десь у цьому залі.

  Вистава створюється методом колективного девайзингу з практиками Viewpoints і Moment Work. Робочу версію команда показує 8 листопада 2026 на Kosovo Theatre Showcase у Призрені після резиденції разом із Qendra Multimedia. Прем'єра — 12 і 13 грудня 2026 у Києві.

  Залишайтеся до кінця.
description_en: |
  Everyone wears a uniform. A suit for work, a smile for the family, a role that keeps everyone comfortable. Some uniforms are made of fabric. Most of them are visible only from the inside.

  Tonight, there’s a show. The host is ready, the room is full, and the programme promises stories, songs and the kind of dark humour soldiers share only among themselves. At the very end, a secret.

  Under the Uniform grew from interviews with Ukrainian veterans and active service members. It is a story about people society celebrates as heroes, and about the part of them it prefers to leave unseen: their right to be themselves, and to love. What happens in the army happens everywhere else too. Anyone who has ever played a role to be accepted will find themselves somewhere in this room.

  The piece is created through collective devising with Viewpoints and Moment Work. The team shows a work-in-progress at Kosovo Theatre Showcase in Prizren on 8 November 2026, after a residency with Qendra Multimedia. The premiere is in Kyiv on 12 and 13 December 2026.

  Stay till the end.
