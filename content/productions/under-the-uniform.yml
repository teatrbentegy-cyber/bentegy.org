hook_en: "One evening, two shows. Which one really happened is for you to decide."
description_uk: |
  Цю країну захищають люди, яких вона бачить лише у формі.

  У формі ти герой. Без неї починаються питання: хто ти, з ким живеш, кого любиш і чому про це мовчиш. Тож одну форму міняють на іншу: костюм, роль, жарт, зручну для всіх версію себе. Цю маску носять так довго, що вона починає відгукуватися на твоє ім'я.

  «Під уніформою» — вистава про момент, коли маска вже не тримається. Четверо чоловіків, шоу без світла й одне питання: ким ти лишаєшся, коли тебе ніхто не бачить, і чи наважишся бути ним при світлі.

  **За один вечір ми покажемо вам два шоу: те, яке мало статися, і те, яке сталося насправді. Яке з них яке — вирішує кожен.**

  Вистава виросла з інтерв'ю з ветеранами, ветеранками й чинними військовими. Серед них — представники ЛГБТК+ спільноти, і саме їхній досвід стоїть у центрі історії. Герої вигадані, досвід справжній.

  У статуті прописано навіть п'ятдесят сантиметрів між ліжками в казармі. Для двох чоловіків, які люблять одне одного, графи в законі досі немає — тому один герой каже про іншого: «Мені ніхто не скаже, де він. Я йому — ніхто». Половину вечора зала сміється; потім вистава забирає цей сміх назад.
description_en: |
  This country is defended by people it sees only in uniform.

  In uniform, you are a hero. Without it, the questions begin: who you are, who you live with, who you love, and why you keep quiet about it. So one uniform is swapped for another: a costume, a role, a joke, a version of yourself that suits everyone. The mask is worn for so long that it starts answering to your name.

  Under the Uniform is about the moment the mask no longer holds. Four men, a show with the lights out and one question: who are you when no one can see you, and will you dare to be that person in the light?

  **In one evening, we present two shows: the one that was supposed to happen and the one that actually did. Which is which is up to each of you.**

  The performance grew out of interviews with veterans, both men and women, and with active-duty service members. Some of them are LGBTQ+, and it is their experience that sits at the heart of the story. The characters are invented; the experience is real.

  Military regulations specify even the fifty centimetres between beds in a barracks. For two men who love each other, the law still makes no provision at all. So one character says of the other: “No one will tell me where he is. I’m nobody to him.” For half the evening the audience laughs; then the performance takes that laughter back.
