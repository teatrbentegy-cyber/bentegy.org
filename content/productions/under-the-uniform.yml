history_uk: |
  **Як усе почалося.** Поверхом нижче від простору театру «НАШі», де працюють Бентеги, розташований Veterans Hub ГО «Українські ЛГБТ-військові за рівні права». Звідти почалося знайомство з людьми, чиї історії лягли в основу вистави. Ще одним поштовхом став мюзикл «Nkoli» на фестивалі Theater der Welt у Німеччині. Команда записала інтерв'ю з ЛГБТК+ військовими й ветеранами і зібрала з них художню історію.

  **Призрен, листопад 2026.** Першу версію команда створила в резиденції з Qendra Multimedia і показала 8 листопада на [Kosovo Theatre Showcase 2026](https://qendra.org/kosovo-theatre-showcase-2026-dates-announced-registration-open/?lang=en) у галереї Міського театру ім. Бекіма Фехміу: соло для Сашка Петрини, ведучий на відео — Костя Шахман. Після показу — розмова з глядачами. Паралельно з репетиціями команда працювала над повною версією п'єси разом із драматургом Qendra.

  **Київ, грудень 2026.** 11 грудня вистава вперше звучить у Києві в повному складі.
history_en: |
  **How it began.** One floor below the NASHi theatre space, where Bentegy works, is the Veterans Hub of the NGO Ukrainian LGBT Military for Equal Rights. That is where the team met the people whose stories the performance is built on. Another push came from the musical Nkoli at Theater der Welt in Germany. The team recorded interviews with LGBTQ+ soldiers and veterans and turned them into a fictional story.

  **Prizren, November 2026.** The first version was created during a residency with Qendra Multimedia and shown on 8 November at [Kosovo Theatre Showcase 2026](https://qendra.org/kosovo-theatre-showcase-2026-dates-announced-registration-open/?lang=en) in the gallery of the Bekim Fehmiu City Theatre: a solo for Sashko Petryna, with Kostia Shakhman as the host on video, followed by a conversation with the audience. Alongside rehearsals, the team worked on the full version of the play with Qendra's dramaturg.

  **Kyiv, December 2026.** On 11 December the full company performs it in Kyiv for the first time.
quotes:
  - text_uk: "Для мене «Під уніформою» — про ідентичність: як ми проживаємо власний досвід і шукаємо йому місце в тому, ким ми є. Частину цього досвіду ми не обирали, і все одно маємо з ним примиритися."
    text_en: "To me, it is about identity and the struggle to navigate our experiences and make sense of how they fit into our sense of self. Some of these experiences are things we never chose, yet we still have to find a way to reconcile them with who we are."
    author: Florida Kastrati
