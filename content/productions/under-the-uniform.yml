history_uk: |
  **Як усе почалося.** Поверхом нижче від простору театру «НАШі», де працюють Бентеги, розташований Veterans Hub ГО «Українські ЛГБТ-військові за рівні права». Звідти почалося знайомство з людьми, чиї історії лягли в основу вистави. Ще одним поштовхом став мюзикл «Nkoli» на фестивалі Theater der Welt у Німеччині. Команда записала інтерв'ю з ветеранами, ветеранками й чинними військовими, серед них — представники ЛГБТК+ спільноти, і зібрала з них художню історію.

  **Призрен, листопад 2026.** Першу версію команда створила в резиденції з Qendra Multimedia і показала 8 листопада на [Kosovo Theatre Showcase 2026](https://qendra.org/kosovo-theatre-showcase-2026-dates-announced-registration-open/?lang=en) у галереї Міського театру ім. Бекіма Фехміу: соло для Сашка Петрини, ведучий на відео — Костя Шахман. Після показу — розмова з глядачами. Паралельно з репетиціями команда працювала над повною версією п'єси разом із драматургом Qendra.

  **Київ, грудень 2026.** 11 грудня — київська прем'єра копродукції Україна — Косово, вперше в повному складі.
history_en: |
  **How it began.** One floor below the NASHi theatre space, where Bentegy works, is the Veterans Hub of the NGO Ukrainian LGBT Military for Equal Rights. That is where the team met the people whose stories the performance is built on. Another push came from the musical Nkoli at Theater der Welt in Germany. The team recorded interviews with veterans, both men and women, and with active-duty service members, including members of the LGBTQ+ community, and shaped them into a work of fiction.

  **Prizren, November 2026.** The first version was created during a residency with Qendra Multimedia and shown on 8 November at [Kosovo Theatre Showcase 2026](https://qendra.org/kosovo-theatre-showcase-2026-dates-announced-registration-open/?lang=en) in the gallery of the Bekim Fehmiu City Theatre: a solo for Sashko Petryna, with Kostia Shakhman as the host on video, followed by a conversation with the audience. Alongside rehearsals, the team worked on the full version of the play with Qendra’s dramaturg.

  **Kyiv, December 2026.** On 11 December, this Ukraine–Kosovo co-production premieres in Kyiv, with the full cast together on stage for the first time.
quotes:
  - text_uk: "Перформер Сашко Петрина досліджує, що лишається за кадром публічного визнання військової служби: право бути собою й любити поза уніформою."
    text_en: "Performer Sashko Petryna explores what the public recognition of military service blanks out: the right to be yourself and to love beyond the uniform."
    author: Lina Wölfel
    role_uk: Theater der Zeit (Німеччина), про робочу версію в Призрені
    role_en: Theater der Zeit (Germany), on the work-in-progress in Prizren
    url: https://tdz.de/artikel/kosovo-theatre-showcase-prizren
  - text_uk: "Майстерно написана, поставлена й зіграна вистава про важливі питання: як бути собою, служачи своїй країні, і яку високу ціну за це доводиться платити. «Під уніформою» — своєчасний і зворушливий документальний театр у найкращому його прояві. Цю виставу мають побачити всі."
    text_en: "A skillfully written, directed and performed play which examines important questions about living an authentic life while serving one’s country, and the heavy cost of doing so. Under the Uniform is a timely and moving piece of documentary theatre at its finest, which everyone needs to see."
    author: Michael Blaha
    role_uk: театральний продюсер, Fringe Management LLC, після показу в Призрені
    role_en: Theatre producer, Fringe Management LLC, after the showing in Prizren
  - text_uk: "Для квір-людей бінарна природа війни часто означає виключення й задуху. Потрібна сміливість навіть для того, щоб замислитися, як це розплутати, особливо в такий час. Те, що вдалося команді «Під уніформою», — соціально нагальне, а художньо сповнене дотепності й нестерпної легкості."
    text_en: "For queer people, the binary nature of war can often be excluding and suffocating. It takes courage even to think about untangling that, especially at a time like this. What the team have managed with Under the Uniform is socially urgent, and artistically full of wit and an unbearable lightness."
    author: Aurela Kadriu
    role_uk: програмна директорка Qendra Multimedia, після показу в Призрені
    role_en: Program Director, Qendra Multimedia, after the showing in Prizren
  - text_uk: "Для мене «Під уніформою» — про ідентичність: як ми проживаємо власний досвід і шукаємо йому місце в тому, ким ми є. Частину цього досвіду ми не обирали, і все одно маємо з ним примиритися."
    text_en: "To me, it is about identity and the struggle to navigate our experiences and make sense of how they fit into our sense of self. Some of these experiences are things we never chose, yet we still have to find a way to reconcile them with who we are."
    author: Florida Kastrati
    role_uk: Qendra Multimedia, після показу в Призрені
    role_en: Qendra Multimedia, after the showing in Prizren
