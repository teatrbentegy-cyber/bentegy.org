summary_en: A ritual performance about the hunger for life. Winner of the NAOSLIP pitch, produced by Bentegy Theatre.
hook_uk: "Три жінки, один посильний і кінь за вікном. Вішнек як ритуал."
hook_en: "Three women, one messenger and a horse outside the window. Vișniec as ritual."
description_uk: |
  Вистава-ритуал про жагу до життя. Її головне питання: що робить людина, коли навколо руйнується світ?

  У п'єсі Вішнєка три домівки і три жінки: мати, донька, дружина. До кожної приходить той самий Посильний зі звісткою з полку, а за вікном ходить кінь. Між сценами Посильний виходить до рампи й зачитує мирні угоди. Абсурд тримає цілком упізнаваний досвід: побутові правила як спосіб протриматися, звістку, повернення. Команда отримала права на постановку напряму від автора.

  Виставу створили четвертокурсники КНУТКіТ ім. І. К. Карпенка-Карого з майстерні народної артистки України Наталії Долі разом із режисером Євгеном Щербанем. Проєкт переміг у відкритому пітчингу НАОСЛІП; від пітчингу до прем'єри минуло 72 дні. Театр Бентеги продюсує показ: майданчик, квитки, промо, роботу з пресою і глядачем. Художні рішення лишаються за командою.

  Вистава говорить про війну і втрату близьких. У ній гучні звуки, стробоскоп, темрява, дим і вогонь. Залу можна залишити будь-якої миті.
description_en: |
  A ritual performance about the hunger for life, asking what a person does when the world around them collapses.

  Vișniec’s play has three homes and three women: a mother, a daughter, a wife. The same Messenger comes to each with news from the regiment, while a horse walks outside the window. Between scenes the Messenger steps to the footlights and reads out peace treaties. The absurd holds a recognisable experience: everyday rules as a way to hold on, the news, the return. The team received the staging rights directly from the author.

  The piece was created by fourth-year students of the Kyiv National I. K. Karpenko-Kary University of Theatre, Cinema and Television (studio of People’s Artist of Ukraine Nataliia Dolia) with director Yevhen Shcherban. It won the open NAOSLIP pitch and reached its premiere 72 days later. Bentegy Theatre produces the showing: venue, ticketing, promotion, press and audience care. Artistic decisions stay with the team.

  The performance deals with war and the loss of loved ones. It includes loud sounds, strobe light, darkness, haze and fire. You may leave the hall at any moment.
