summary_uk: Проєкт-переможець пітчингу «НАОСЛІП». За продюсування незалежного театру Бентеги.
summary_en: Winner of the NAOSLIP pitch. Produced by Bentegy independent theatre.
description_uk: |
  Проєкт-переможець відкритого пітчингу «НАОСЛІП». Студентська робота, яку команда вже показувала власними силами, виходить як професійна постановка: продюсування, майданчик, промо, квитки й менторський супровід бере на себе незалежний театр Бентеги.

  У виставі гучні звуки, стробоскоп, темрява, дим і вогонь. Залу можна залишити будь-якої миті.
description_en: |
  Winner of the open NAOSLIP pitch. A student piece the team had already shown on its own now becomes a professional production, with producing, venue, promotion, ticketing and mentoring by Bentegy independent theatre.

  The performance includes loud sounds, strobe light, darkness, haze and fire. You may leave the hall at any moment.
