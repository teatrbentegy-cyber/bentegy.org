summary_uk: Троє жінок шукають вихід з бару. Єдина умова простору — сказати промову.
summary_en: Three women look for a way out of a bar. The space has one condition — deliver a speech.
description_uk: |
  Нова версія дебютної київської вистави театру — зі зміненою ідеєю, текстом і акторським складом.

  Бар, з якого троє жінок шукають вихід. Наскрізна репліка — «Ви виглядаєте втомлено». Дослідження публічної мови, маніпуляції та колективної тиші.
description_en: |
  A new version of the company’s first Kyiv production, with a new concept, text and cast.

  Three women look for a way out of a bar. A recurring line: “You look tired.” An inquiry into public language, manipulation and collective silence.
