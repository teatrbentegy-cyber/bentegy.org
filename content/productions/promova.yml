hook_uk: "Справжній бар, троє жінок і промова, яку кожна з них носила роками."
hook_en: "A real bar, three women and the speech each of them has carried for years."
description_uk: |
  *Ви виглядаєте втомлено.* Знаємо. Ми теж.

  Тривоги, новини, дедлайни, безкінечна стрічка. «Промова 2.0» — вечір, коли можна зупинитися й побути з собою.

  Вистава відбувається в барі, і бар справжній: він працює весь вечір. Приходь трохи раніше, візьми келих і займи місце за столиком. Вистава починається одразу, як ти заходиш.

  Троє жінок у барі шукають вихід. Простір ставить одну умову: сказати промову, яку кожна з них довго носила в собі. Вона про втому, про любов і про те, що тримає, коли все навколо хитається. 45 хвилин на відстані витягнутої руки.

  Нова версія «Промови», дебютної вистави театру 2025 року, — зі зміненою ідеєю, текстом і акторським складом.
description_en: |
  *You look tired.* We know. So are we.

  Air-raid alerts, news, deadlines, a feed that never ends. The Speech 2.0 is an evening to pause and spend some time with yourself.

  The performance takes place in a bar, and the bar is real: it is open all evening. Come a little early, grab a drink and find a table. The performance begins as soon as you walk in.

  Three women in a bar look for a way out. The space sets one condition: deliver the speech each of them has been carrying for years. It is about exhaustion, about love, and about what holds you together when everything around you is shaking. 45 minutes, within arm’s reach.

  A new version of The Speech, the company’s 2025 debut, with a new concept, text and cast.
