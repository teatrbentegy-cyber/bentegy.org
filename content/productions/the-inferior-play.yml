summary_uk: Міждисциплінарне дослідження гри як чуттєвої практики присутності. Замість глядачів — гості-дослідники.
summary_en: An interdisciplinary study of play as a sensory practice of presence. Instead of spectators, guest researchers.
description_uk: |
  Міждисциплінарний проєкт-дослідження гри як чуттєвої практики присутності. Це не вистава в класичному сенсі: замість глядачів тут гості-дослідники, а межа між грою і життям поступово зникає.

  Проєкт існує у форматі відкритої лабораторії — плейтести, воркшопи, відкриті репетиції, розмови й архів. Гра тут постає як «щеплення від іронії» і вправа на стійкість. Незавершеність work-in-progress — частина задуму.

  Проєкт є переможцем грантової програми Per Forma, яку здійснює платформа Kyiv Contemporary Music Days за підтримки Performing Arts Fund NL та Міністерства освіти, культури та науки Нідерландів для розвитку сектору перформативних мистецтв в Україні.
description_en: |
  An interdisciplinary research project on play as a sensory practice of presence. It is not a performance in the classical sense: instead of spectators there are guest researchers, and the line between play and life gradually disappears.

  The project works as an open laboratory: playtests, workshops, open rehearsals, conversations and an archive. Play becomes an “inoculation against irony” and an exercise in resilience. Being a work in progress is part of the idea.

  The project is a winner of the Per Forma grant programme run by Kyiv Contemporary Music Days with the support of Performing Arts Fund NL and the Ministry of Education, Culture and Science of the Netherlands for the development of the performing arts sector in Ukraine.
