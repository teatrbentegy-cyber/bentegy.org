description_uk: |
  The Inferior Play — міждисциплінарний проєкт-дослідження гри режисерки й кураторки Марічки Гавриш: гра як чуттєва практика присутності, спосіб буття і спосіб мистецтва. Гру звикли вважати дитячою, «нижчою» — inferior. Проєкт повертає їй гідність: саме гра тренує гнучкість, стійкість і довіру, без яких неможливі ні культура, ні мистецтво.

  Дослідження живе як серія плейтестів і ворк-ін-прогресів навесні й улітку 2026 року — щоразу нова версія чуттєвої інсталяції. Гості тут дослідники, а поруч із ними — інші гравці; м'яч, пляшка чи іграшка стають повноцінними учасниками гри. Головне правило — берегти гру: підіграти тому, хто слабший, щоб гра тривала. Кожна гра лишає сліди й стає частиною архіву дослідження.

  Фінальна презентація проєкту — окрема робота, [«Гра на Вершинці»](/vystavy/hra-na-vershyntsi/).
description_en: |
  The Inferior Play is an interdisciplinary research project on play by director and curator Marichka Havrysh: play as a sensory practice of presence, a way of being and a way of making art. Play is usually treated as childish, “inferior”. The project gives it back its dignity: play builds the flexibility, resilience and trust that culture and art depend on.

  The research lives as a series of playtests and works in progress through spring and summer 2026, each a new version of a sensory installation. Guests are researchers, alongside other players; a ball, a bottle or a toy become full participants in the game. The main rule is to protect the game: play along with whoever is weaker so the game can go on. Every game leaves traces and becomes part of the research archive.

  The project’s final presentation is a separate work, [The Game on Vershynka](/en/productions/hra-na-vershyntsi/).
