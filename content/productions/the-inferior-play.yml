summary_uk: Перформативний проєкт Марічки Гавриш про гру як спосіб бути присутніми одне з одним. Гості самі обирають міру своєї участі.
summary_en: A performative project by Marichka Havrysh on play as a way of being present with one another. Guests choose how far they take part.
description_uk: 'The Inferior Play — перформативний проєкт режисерки та перформерки Марічки Гавриш, який досліджує гру як спосіб бути присутніми одне з одним, взаємодіяти й створювати спільний досвід. До гри ми звертаємося тоді, коли шукаємо знання, — і коли у спільноті є рівність, свобода та довіра.


  Проєкт живе як відкрита лабораторія: плейтести, відкриті репетиції, проміжні ігри, розмови й архів. Між глядачами й діячами — цілий спектр, і кожен гість сам регулює міру своєї участі.


  Фінальна презентація «Гра на Вершинці» вперше винесла дослідження з репетиційної зали в місто — на маршрут уздовж прихованої річки Вершинки на Чоколівці. Учасники разом пройшли ігровим маршрутом уздовж води, оживлюючи її присутністю, сміхом і рухом, і пригадали, як це — гратися надворі.


  Проєкт реалізовано за підтримки грантової програми Per Forma, яку здійснює платформа Kyiv Contemporary Music Days за підтримки Performing Arts Fund NL та Міністерства освіти, культури та науки Нідерландів для розвитку сектору перформативних мистецтв в Україні.

  '
description_en: 'The Inferior Play is a performative project by director and performer Marichka Havrysh that explores play as a way of being present with one another, interacting and creating shared experience. We turn to play when we are searching for knowledge, and when a community holds equality, freedom and trust.


  The project lives as an open laboratory: playtests, open rehearsals, interim games, conversations and an archive. Between audience and performers lies a whole spectrum, and every guest sets their own degree of participation.


  The final presentation, “The Game on Vershynka”, took the research out of the rehearsal room and into the city for the first time, along the hidden Vershynka river in Chokolivka. Participants walked a playful route along the water together, bringing it to life with presence, laughter and movement, and remembering what it feels like to play outdoors.


  Supported by the Per Forma grant programme run by Kyiv Contemporary Music Days with the support of Performing Arts Fund NL and the Ministry of Education, Culture and Science of the Netherlands for the development of the performing arts sector in Ukraine.

  '
