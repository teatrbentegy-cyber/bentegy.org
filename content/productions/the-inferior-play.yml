hook_en: "A laboratory of play: bodies, plastic and rules still being written."
description_uk: |
  The Inferior Play — перформативний проєкт режисерки та перформерки Марічки Гавриш, який досліджує гру як спосіб бути присутніми одне з одним, взаємодіяти й створювати спільний досвід. До гри ми звертаємося тоді, коли шукаємо знання, — і коли у спільноті є рівність, свобода та довіра.

  Проєкт живе як відкрита лабораторія: плейтести, відкриті репетиції, проміжні ігри, розмови й архів. Між глядачами й діячами — цілий спектр, і кожен гість сам регулює міру своєї участі.

  19 березня 2026 року команда показала робочу версію: тіла перформерів і пластикова інсталяція Єви Жукалюк, у якій правила гри народжуються просто на очах у глядачів. Фінальна презентація проєкту — окрема робота, [«Гра на Вершинці»](/vystavy/hra-na-vershyntsi/).
description_en: |
  The Inferior Play is a performative project by director and performer Marichka Havrysh that explores play as a way of being present with one another, interacting and creating shared experience. We turn to play when we are searching for knowledge, and when a community holds equality, freedom and trust.

  The project lives as an open laboratory: playtests, open rehearsals, interim games, conversations and an archive. Between audience and performers lies a whole spectrum, and every guest sets their own degree of participation.

  On 19 March 2026 the team showed a work in progress: the performers’ bodies and Yeva Zhukaliuk’s plastic installation, where the rules of the game are born in front of the audience. The project’s final presentation is a separate work, [The Game on Vershynka](/en/productions/hra-na-vershyntsi/).
