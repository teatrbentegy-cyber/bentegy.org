description_uk: |
  The Inferior Play — міждисциплінарний проєкт-дослідження гри режисерки й кураторки Марічки Гавриш: гра як чуттєва практика присутності, спосіб буття і спосіб мистецтва. Гру звикли вважати дитячою, «нижчою» — inferior. Проєкт повертає їй гідність: саме гра тренує гнучкість, стійкість і довіру, на яких тримаються культура й мистецтво.

  Дослідження тривало з лютого по серпень 2026 року як серія плейтестів і ворк-ін-прогресів — щоразу нова версія чуттєвої інсталяції. Гості ставали дослідниками, а поруч із ними — інші гравці; м'яч, пляшка чи іграшка ставали повноцінними учасниками гри. Головне правило — берегти гру: підіграти тому, хто слабший, щоб гра тривала. Кожна гра лишила сліди й стала частиною архіву дослідження.

  Фінальною публічною подією проєкту стала перформанс-прогулянка [«Гра на Вершинці»](/vystavy/hra-na-vershyntsi/).
description_en: |
  The Inferior Play is an interdisciplinary research project on play by director and curator Marichka Havrysh: play as a sensory practice of presence, a way of being and a way of making art. Play is usually treated as childish, “inferior”. The project gives it back its dignity: play builds the flexibility, resilience and trust that culture and art depend on.

  The research ran from February to August 2026 as a series of playtests and works in progress, each a new version of a sensory installation. Guests took part as researchers, alongside the other players; a ball, a bottle or a toy became a full participant in the game. The main rule was to protect the game: help the weaker player along so the game could go on. Every game left traces and became part of the research archive.

  The project’s final public event was the performance walk [The Game on Vershynka](/en/productions/hra-na-vershyntsi/).
