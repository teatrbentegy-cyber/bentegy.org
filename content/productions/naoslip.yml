description_uk: |
  НАОСЛІП — вечір незалежного театру, яким 7 серпня 2026 року Театр Бентеги відкрив свій перший репертуарний сезон. Уперше за одним столом зібралися незалежні театри з чотирьох міст: «Гармидер» (Луцьк), «Химери» (Харків), «Лава» (Львів), Експериментальний театральний клуб «НАШі» та Бентеги (Київ). Сім годин програми на двох сценах простору КультМотив і понад 250 гостей, майже половина з яких працює поза театром.

  ## Програма вечора

  - **Шоукейси театрів.** «Гармидер», «Химери» й «Лава» показали свої роботи одне одному й глядачам.
  - **Поп-апи вистав сезону.** Ескізи вистав Бентег виникали просто серед гостей: «Промова» на барі, станція гри The Inferior Play, ансамбль «Кінця зміни», соло «Між світом і душею» про Стуса.
  - **Розмова п'яти театрів.** 75 хвилин публічної дискусії про умови, в яких працює незалежна сцена; остання третина — питання із залу. Підґрунтям стало відкрите опитування «Карта незалежного театру України 2026».
  - **Відкритий пітчинг молодих команд.** П'ятеро фіналістів презентували проєкти зі сцени, рішення журі оголосили того ж вечора.
  - **«Троянські жінки».** Уривок вистави «НАШі» на заході сонця.
  - **Музика й нетворкінг.** Концерт Марії Чуприненко і «порожній стіл» — простір для нових знайомств і спільних задумів.

  ## Про що говорили театри

  Ізоляцію учасники назвали раніше за гроші. Говорили про конкуренцію, яку формує театральна освіта, про економіку подвійної зайнятості, про театр як бізнес-модель і про те, чому попередні спроби об'єднати сектор завершилися. Розмову докладно переказало [Суспільне Культура](https://suspilne.media/culture/1402828-performativnij-sektor-najtoksicnisij-v-ukraini-pro-so-govorili-nezalezni-teatri-z-kieva-lvova-harkova-ta-lucka/).

  З розмови виросли конкретні кроки: «Гармидер» запускає форум-театр про внутрішні процеси колективів і ділиться результатами, «Лава» будує у Львові спільну сцену для різних курсів і театрів з інших міст, «Химери» запропонували горизонтальне менторство, Бентеги — копродукцію показів у Києві, майданчики у Львові й резиденції в Луцьку.

  ## Переможець пітчингу

  Переміг проєкт «Коні за вікном» за п'єсою Матея Вішнека — робота студентів майстерні Наталії Долі в КНУТКіТ ім. Карпенка-Карого в режисурі Євгена Щербаня. Через 72 дні вистава вийшла на професійну прем'єру в просторі «Хора» за продюсування Театру Бентеги.

  НАОСЛІП — початок тривалої роботи: наступна зустріч має стати звітом про те, що театри вже зробили одне для одного.
description_en: |
  NAOSLIP is the evening of independent theatre with which Bentegy Theatre opened its first repertoire season on 7 August 2026. For the first time, independent theatres from four cities sat at one table: Harmyder (Lutsk), Khymery (Kharkiv), Lava (Lviv), the NASHi Experimental Theatre Club and Bentegy (Kyiv). Seven hours of programme on two stages at KultMotyv, and more than 250 guests, almost half of them from outside the theatre profession.

  ## The programme

  - **Theatre showcases.** Harmyder, Khymery and Lava showed their work to one another and to the audience.
  - **Pop-ups from the new season.** Sketches of Bentegy’s productions appeared right among the guests: The Speech at the bar, a play station from The Inferior Play, the End of Shift ensemble, and the Stus solo Between the World and the Soul.
  - **A conversation between five theatres.** 75 minutes of public discussion on the conditions of the independent scene, with the final third given to questions from the floor, grounded in the open survey “Map of Independent Theatre in Ukraine 2026”.
  - **An open pitch for young teams.** Five finalists presented their projects on stage; the jury announced its decision the same evening.
  - **Trojan Women.** An excerpt from the NASHi production at sunset.
  - **Music and networking.** A concert by Mariia Chuprynenko and an “empty table” for new acquaintances and shared plans.

  ## What the theatres talked about

  Isolation was named before money. The conversation covered competition shaped by theatre education, the economics of holding two jobs, theatre as a business model, and why earlier attempts to unite the sector came to an end. It was covered in detail by [Suspilne Culture](https://suspilne.media/culture/1402828-performativnij-sektor-najtoksicnisij-v-ukraini-pro-so-govorili-nezalezni-teatri-z-kieva-lvova-harkova-ta-lucka/) (in Ukrainian).

  Concrete steps grew out of it: Harmyder is launching a forum theatre on the inner life of companies and sharing the results, Lava is building a shared stage in Lviv for different acting courses and visiting theatres, Khymery proposed horizontal mentoring, and Bentegy offered co-produced showings in Kyiv, venues in Lviv and residencies in Lutsk.

  ## The pitch winner

  The winner was Horses Outside the Window after Matei Vișniec, a piece by students of Nataliia Dolia’s workshop at the Karpenko-Kary University, directed by Yevhen Shcherban. Seventy-two days later it premiered professionally at Chora Stage, produced by Bentegy Theatre.

  NAOSLIP is the start of long-term work: the next meeting is meant to be a report on what the theatres have already done for one another.
