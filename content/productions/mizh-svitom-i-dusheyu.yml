summary_uk: Памʼять, спротив і моральний вибір крізь постать поета Василя Стуса.
summary_en: Memory, resistance and moral choice through the figure of the poet Vasyl Stus.
description_uk: |
  Документальна моновистава, побудована на поезії, листах і автобіографічній прозі Василя Стуса.

  Документальне дослідження поєднується з фізичними практиками за методом Тадаші Судзукі та мінімалістичною сценографією: сорочка, дві дошки, відро води, крапля, що відміряє час.
description_en: |
  A documentary solo performance built from the poetry, letters and autobiographical prose of Vasyl Stus.

  Documentary research meets physical practice drawing on Tadashi Suzuki’s method and a minimal stage: a shirt, two planks, a bucket of water, a drop that measures time.
