summary_uk: Памʼять, спротив і моральний вибір крізь постать поета Василя Стуса.
summary_en: Memory, resistance and moral choice through the figure of the poet Vasyl Stus.
description_uk: |
  Не біографія Василя Стуса, а тілесне дослідження стану: що відбувається з людиною, коли система намагається відібрати все — мову, простір, час, свободу, — а вона залишається собою.

  Драматургічна основа — листи Стуса до дружини Валентини з табору Перм-36 та його вірші. Вони не декламуються, а проступають крізь сценічну дію. Вистава створена за методом японського режисера Тадаші Сузукі, однією з найвимогливіших систем фізичного театру, де актор працює «від ніг», а вага, рух і дихання стають головною мовою.

  Центральний образ — дві звичайні дерев'яні дошки, які протягом дії стають ґратами, кліткою і хрестом. Актор переставляє і несе їх сам: трансформація фізична, а не метафорична.

  Вистава народжувалася як відкритий процес: допрем'єрний показ work-in-progress, а після прем'єри — розмова з глядачами. Адаптивна сценографія дає змогу показувати її на гастролях і фестивалях.
description_en: |
  Not a biography of Vasyl Stus but a bodily study of a state: what happens to a person when the system tries to take everything — language, space, time, freedom — and they remain themselves.

  The dramaturgical source is Stus’s letters to his wife Valentyna from the Perm-36 labour camp, and his poems. They are not recited but surface through stage action. The piece is made through the method of Japanese director Tadashi Suzuki, one of the most demanding systems of physical theatre, where the actor works “from the feet up” and weight, movement and breath become the primary language.

  The central image is two ordinary wooden boards that become prison bars, a cage and a cross. The actor moves and carries them himself: the transformation is physical, not metaphorical.

  The piece grew as an open process, with a work-in-progress showing before the premiere and a conversation with the audience after it. Its adaptive scenography makes touring and festival showings possible.
