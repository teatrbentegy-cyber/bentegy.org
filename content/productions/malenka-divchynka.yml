summary_uk: Документальна історія про тишу і право нарешті сказати вголос. За реальними свідченнями.
summary_en: A documentary story about silence and the right to finally speak out. Based on real testimonies.
description_uk: |
  Документальна драма про дорослішання, у якому подорослішати довелося надто рано, — про тишу навколо насильства і право нарешті бути почутою. Вистава збирається з реальних свідчень, які зазвичай лишаються непочутими.

  Тема чутлива, тому ми працюємо з нею обережно: з повагою до людей, які діляться своїми історіями, з анонімністю й згодою, із попередженням про зміст і підтримкою для глядачів на показах.

  Вистава в розробці. Про дати прем'єри повідомимо в афіші та в Instagram @teatr.bentegy.
description_en: |
  A documentary drama about growing up too early — about the silence around violence and the right to finally be heard. The piece is built from real testimonies that usually go unheard.

  The subject is sensitive, so we work with care: with respect for the people who share their stories, with anonymity and consent, with content notes and support for the audience at every performance.

  The production is in development. Premiere dates will be announced in the schedule and on Instagram @teatr.bentegy.
