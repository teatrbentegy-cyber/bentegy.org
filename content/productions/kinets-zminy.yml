summary_uk: Як колективний тиск переписує ідентичність — і що потрібно, щоб лишатися собою.
summary_en: How collective pressure rewrites identity — and what it takes to remain yourself.
hook_uk: "Усе місто п'є нову воду. Одна людина відмовляється."
hook_en: "The whole town drinks the new water. One person refuses."
description_uk: |
  Одного дня в місто приносять нову воду. Її п'ють усі. Люди змінюються: інакше рухаються, інакше думають і щиро вірять, що так і має бути. Не п'є тільки один. Він бачить, як змінюються сусіди й друзі, і з кожним днем лишається дедалі самотнішим. Скільки можна залишатися собою, якщо всі навколо вважають божевільним саме тебе?

  Чотирнадцять виконавців розповідають цю історію тілом, без жодного слова. На сцені відра з водою на коромислі, крапельниці, рожеві окуляри і стіна з дерев'яних палиць, яка росте просто на очах. Сюжет зрозумілий з першої сцени, підготовка чи знання сучасного танцю для перегляду зайві.

  Це вистава про конформізм: як легко прийняти чужі правила за свої і назвати це дорослішанням.

  В основі — суфійська притча «Як змінилася вода». Вистава йде без словесного тексту, тож відкрита для нечуючих глядачів, іноземців і тих, хто в театрі ще не бував.

  «Кінець зміни» — дебютна режисерська робота повного формату хореографа Владислава Дирди і перша постановка заснованого ним театрального проєкту «Межа». Робота над виставою тривала близько семи місяців, з відкритими репетиціями та двома показами work-in-progress. Продюсує Театр Бентеги.
description_en: |
  One day the town gets new water. Everyone drinks it. People change: they move differently, think differently and sincerely believe this is how it should be. Only one man refuses to drink. He watches his neighbours and friends change and grows lonelier every day. How long can you stay yourself when everyone around you thinks you are the one who has gone mad?

  Fourteen performers tell this story with their bodies, without a single word. On stage: buckets of water on a yoke, IV drips, rose-tinted glasses and a wall of wooden poles that grows before your eyes. The story is clear from the first scene; no background in contemporary dance is needed.

  A performance about conformity: how easily we accept someone else’s rules as our own and call it growing up.

  It is based on the Sufi parable “When the Waters Were Changed”. With no spoken text, the piece is open to Deaf audiences, visitors from abroad and people who have never been to the theatre.

  End of Shift is the first full-length piece directed by choreographer Vladyslav Dyrda and the first production of his Mezha theatre project. It was made over about seven months, with open rehearsals and two work-in-progress showings. Produced by Bentegy Theatre.
