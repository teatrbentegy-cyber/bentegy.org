summary_uk: Як колективний тиск переписує ідентичність — і що потрібно, щоб лишатися собою.
summary_en: How collective pressure rewrites identity — and what it takes to remain yourself.
description_uk: |
  Вистава про те, як інформаційні потоки й колективний тиск переписують ідентичність, і скільки сили потрібно, щоб лишатися собою, коли суспільство навʼязує роль.

  На сцені — одинадцять виконавців.
description_en: |
  A performance about how information flows and collective pressure reshape identity, and what it takes to remain yourself when society imposes a role.

  Eleven performers on stage.
