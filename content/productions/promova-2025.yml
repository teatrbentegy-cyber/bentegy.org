description_uk: |
  Перша прем'єра незалежного театру Бентеги, з якої театр почав свій шлях у Києві восени 2025 року.

  «Промова» — експериментальна постановка про мовчання і голос, про здатність почути і про страх бути почутим. Вистава побудована як провокація, що стирає межу між сценою і залом. Вона ставить питання замість відповідей: чому ми мовчимо, коли потрібно говорити? Як звучить тиша, коли вона голосніша за слова? Чи можливо сьогодні сказати правду зі сцени?

  Показ 28 вересня 2025 року — копродукція театру Бентеги, Експериментального театрального клубу «НАШі» та Community Café. У 2026 році вистава повернулася в новій версії — «Промова 2.0».
description_en: |
  The first premiere of the independent Bentegy Theatre, which started the company’s path in Kyiv in autumn 2025.

  The Speech is an experimental piece about silence and voice, the ability to listen and the fear of being heard. It is built as a provocation that erases the line between stage and audience, asking questions instead of giving answers: why do we stay silent when we need to speak? What does silence sound like when it is louder than words? Is it still possible to tell the truth from the stage?

  The 28 September 2025 performance was a co-production of Bentegy Theatre, the NASHi Experimental Theatre Club and Community Café. In 2026 the piece returned in a new version, The Speech 2.0.
