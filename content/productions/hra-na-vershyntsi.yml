hook_en: "A hidden river, a play route and a city you can play in again."
description_uk: |
  «Гра на Вершинці» — фінальна презентація перформативного проєкту Марічки Гавриш [The Inferior Play](/vystavy/the-inferior-play/). Дослідження гри вперше вийшло з репетиційної зали в місто — на маршрут уздовж прихованої річки Вершинки на Чоколівці.

  Учасники разом пройшли ігровим маршрутом уздовж води, оживлюючи її присутністю, сміхом і рухом, і пригадали, як це — гратися надворі. Кожен гість сам обирав міру своєї участі.

  Проєкт реалізовано за підтримки грантової програми Per Forma, яку здійснює платформа Kyiv Contemporary Music Days за підтримки Performing Arts Fund NL та Міністерства освіти, культури та науки Нідерландів для розвитку сектору перформативних мистецтв в Україні.
description_en: |
  The Game on Vershynka is the final presentation of Marichka Havrysh’s performative project [The Inferior Play](/en/productions/the-inferior-play/). For the first time the research on play left the rehearsal room for the city, following the hidden Vershynka river in Chokolivka.

  Participants walked a playful route along the water together, bringing it to life with presence, laughter and movement, and remembering what it feels like to play outdoors. Every guest chose how far to take part.

  Supported by the Per Forma grant programme run by Kyiv Contemporary Music Days with the support of Performing Arts Fund NL and the Ministry of Education, Culture and Science of the Netherlands for the development of the performing arts sector in Ukraine.
