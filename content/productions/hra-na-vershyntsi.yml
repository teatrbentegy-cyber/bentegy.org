hook_uk: "Прихована річка, ігровий маршрут і місто, у яке знову можна гратися."
hook_en: "A hidden river, a play route and a city you can play in again."
description_uk: |
  «Гра на Вершинці» — перформанс-прогулянка вздовж річки Вершинки на Чоколівці, фінальна публічна презентація проєкту Марічки Гавриш [The Inferior Play](/vystavy/the-inferior-play/). Досі дослідження й відкриті ігри відбувалися в репетиційній залі — тут гра вперше вийшла в місто.

  Вершинка — невелика річка, значна частина якої прихована в колекторі; перехожі часто сприймають її як канаву. Учасники разом пройшли ігровим маршрутом уздовж води, оживлюючи її присутністю, сміхом і рухом, і пригадали, як це — гратися надворі. Між глядачами й діячами тут цілий спектр, і кожен гість сам обирав міру своєї участі.

  > «Я тісно познайомилася з річкою Вершинкою, що на Чоколівці — моєму рідному районі. Я хочу познайомити з нею й інших, оживити її присутністю, сміхом, бігом та грою», — Марічка Гавриш.

  Проєкт реалізовано за підтримки грантової програми Per Forma, яку здійснює платформа Kyiv Contemporary Music Days за підтримки Performing Arts Fund NL та Міністерства освіти, культури та науки Нідерландів.
description_en: |
  The Game on Vershynka is a performance walk along the Vershynka river in Chokolivka, the final public presentation of Marichka Havrysh’s project [The Inferior Play](/en/productions/the-inferior-play/). Until then the research and open games had taken place in a rehearsal room; here the game went out into the city for the first time.

  The Vershynka is a small river, much of it hidden in a culvert, that passers-by often take for a ditch. Participants walked a playful route along the water together, bringing it to life with presence, laughter and movement, and remembering what it feels like to play outdoors. Between audience and performers lies a whole spectrum, and every guest chose how far to take part.

  > “I got to know the Vershynka river in Chokolivka, my home district, very closely. I want to introduce others to it and bring it to life with presence, laughter, running and play,” says Marichka Havrysh.

  Supported by the Per Forma grant programme run by Kyiv Contemporary Music Days with the support of Performing Arts Fund NL and the Ministry of Education, Culture and Science of the Netherlands.
