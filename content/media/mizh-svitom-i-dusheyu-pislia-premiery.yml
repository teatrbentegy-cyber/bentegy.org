title_uk: 'Глядач — співавтор: театр Бентеги провів прем’єру «Між Світом і Душею»'
title_en: 'The audience as co-author: Bentegy Theatre premieres Between the World and the Soul'
lead_uk: 11 червня 2026 у просторі Collider відбулася прем’єра монодрами «Між Світом і Душею». Після вистави глядачі залишились на розмову про те, як сучасний незалежний театр будується зсередини.
lead_en: Between the World and the Soul premiered at Collider on 11 June 2026. After the show the audience stayed for a conversation about how independent theatre is built from the inside.
