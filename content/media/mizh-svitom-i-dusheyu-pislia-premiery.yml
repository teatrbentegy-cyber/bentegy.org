production: mizh-svitom-i-dusheyu
body_uk: 'Київ, 11 червня 2026. Незалежний театр Бентеги представив прем’єру монодрами «Між Світом і Душею» у просторі Collider (вул. Кирилівська, 60). Близько п’ятдесяти глядачів побачили виставу — і залишились після неї як учасники розмови про те, як сучасний незалежний театр будується зсередини.


  ## Вистава


  «Між Світом і Душею» — фізичне дослідження стану: що відбувається з людиною, коли система намагається знищити її — і вона однаково залишається собою. Актор Антон Старостін, один на сцені, у постіндустріальному просторі Collider — і дія без антракту, впродовж якої тіло стає єдиною мовою.


  Вистава побудована на методі японського режисера Тадаші Сузукі — системі фізичної роботи з тілом, що вимагає граничної концентрації та витривалості. Дві дерев’яні дошки трансформуються протягом вистави: будматеріал → ґрати → клітка → хрест. Актор сам переставляє, піднімає, несе. Трансформація фізична, а не метафорична.


  ## Аудиторія як частина процесу


  Прем’єрі передував допрем’єрний WIP-показ 7 червня, після якого команда зібрала зворотний зв’язок і продовжила роботу. Прем’єра 11 червня стала першим публічним результатом цього процесу — точкою відліку.


  Після показу глядачі залишились на відкрите обговорення за напоями від партнера вечора Distil.No9 — живу розмову в тому самому просторі, де щойно відбулась вистава. Говорили про тіло, про виснаження, про те, як залишатися собою в системі, що тебе ламає.


  ## Реакція


  > «Перфоманс, в якому актор, як високовольтний дріт, пропускає крізь себе біль Василя Стуса. Відчуття, що я побачила мистецтво в чистому вигляді — шорстке, неідеальне, трошки дике, але дуже щире», — Світлана Люта, глядачка прем’єри.


  > «Не зіграв, а прожив», — глядачка в Instagram про актора Антона Старостіна.


  ## Контекст


  Василь Стус — поет, дисидент, в’язень таборів Перм-36, номінант на Нобелівську премію з літератури 1985 року. Загинув у карцері того ж року. Для театру постать Стуса — точка входу в питання, що зберігає актуальність: що означає залишатися собою, коли система цього не дозволяє?

  '
body_en: |
  Kyiv, 11 June 2026. The independent Bentegy Theatre premiered the solo performance Between the World and the Soul at Collider (60 Kyrylivska St.). Around fifty people saw the show and stayed afterwards to take part in a conversation about how contemporary independent theatre is built from the inside.

  ## The production

  Between the World and the Soul is a physical study of a state: what happens to a person when a system tries to destroy them, and they remain themselves all the same. Actor Anton Starostin, alone on stage in Collider’s post-industrial space, and a performance without an interval in which the body becomes the only language.

  The production is built on the method of Japanese director Tadashi Suzuki, a system of physical work that demands extreme concentration and endurance. Two wooden planks transform over the course of the show: building material → bars → cage → cross. The actor moves, lifts and carries them himself. The transformation is physical, not metaphorical.

  ## The audience as part of the process

  The premiere was preceded by a work-in-progress showing on 7 June, after which the team gathered feedback and kept working. The premiere on 11 June was the first public result of this process, a starting point.

  After the show the audience stayed for an open discussion over drinks from the evening’s partner, Distil.No9: a live conversation in the same space where the performance had just taken place. People talked about the body, about exhaustion, about how to remain yourself inside a system that breaks you.

  ## Response

  > “A performance in which the actor, like a high-voltage wire, channels the pain of Vasyl Stus. I felt I had seen art in its purest form: rough, imperfect, a little wild, but deeply sincere,” said Svitlana Liuta, audience member at the premiere.

  > “He didn’t play it, he lived it,” an audience member wrote on Instagram about actor Anton Starostin.

  ## Context

  Vasyl Stus was a poet, a dissident, a prisoner of the Perm-36 camps and a nominee for the 1985 Nobel Prize in Literature. He died in a punishment cell that same year. For the theatre, Stus is a way into a question that remains urgent: what does it mean to remain yourself when the system does not allow it?
