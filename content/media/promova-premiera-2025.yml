title_uk: 'Новий театр у Києві стартує з провокації: прем’єра «Промови»'
title_en: 'A new theatre in Kyiv opens with a provocation: the premiere of Promova'
lead_uk: У столиці з’явився незалежний театр «Бентеги». Його перша прем’єра — «Промова», постмодерністська театральна провокація. Показ — 28 вересня 2025 у Києві.
lead_en: A new independent theatre, Bentegy, appears in Kyiv. Its first premiere, Promova, is a postmodern theatrical provocation. Performance on 28 September 2025.
