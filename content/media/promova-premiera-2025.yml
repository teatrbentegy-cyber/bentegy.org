body_uk: '## Про театр


  «Бентеги» — незалежна команда молодих митців, що створює живий, чесний, нервовий театр. Неакадемічний, але професійний. Театр, який говорить про важке прямо в очі.


  Театр працює на перетині психологічного й соціального. Його місія — створювати вистави, що змушують відчувати, думати й сперечатися. У центрі — теми травми, постправди та особистої вразливості.


  > «Ми прагнемо говорити про сучасне сучасною мовою».


  ## Про виставу


  «Промова» — експериментальна постановка про мовчання і голос, про здатність почути і про страх бути почутим. Вистава побудована як провокація, яка стирає межу між сценою і залом.


  «Промова» — про питання:


  - Чому ми мовчимо, коли потрібно говорити?

  - Як звучить тиша, коли вона голосніша за слова?

  - Чи можливо сьогодні сказати «правду» зі сцени?


  ## Дата та місце


  Прем’єра: 28 вересня 2025, 18:30. Київ, Community Garden (вул. Кирилівська, 41).


  ## Команда


  - Режисер — Павло Коваль

  - Акторський склад — Софія Баюн, Денис Адамський, Ігор Куриленко

  - Продюсерка — Романа Ізабелла Соутус

  - Стейдж-менеджерка — Софія Форніка

  - Маркетологиня — Ангеліна Бочарова

  - СММ — Даниїл Кузьмін


  Показ 28 вересня — копродукція незалежного театру «Бентеги», Експериментального театрального клубу «НАШі» та Community Café.

  '
body_en: |
  ## About the theatre

  Bentegy is an independent company of young artists making theatre that is alive, honest and raw. Non-academic, but professional. Theatre that looks difficult things straight in the eye.

  The company works at the intersection of the psychological and the social. Its mission is to make productions that make people feel, think and argue. At the centre are themes of trauma, post-truth and personal vulnerability.

  > “We want to speak about the present in a present-day language.”

  ## About the production

  The Speech is an experimental production about silence and voice, about the ability to listen and the fear of being heard. It is built as a provocation that erases the line between stage and audience.

  The Speech asks:

  - Why do we stay silent when we need to speak?
  - What does silence sound like when it is louder than words?
  - Is it possible today to tell “the truth” from the stage?

  ## Date and venue

  Premiere: 28 September 2025, 18:30. Kyiv, Community Garden (41 Kyrylivska St.).

  ## The team

  - Director: Pavlo Koval
  - Cast: Sofiia Baiun, Denys Adamskyi, Ihor Kurylenko
  - Producer: Romana Isabella Soutus
  - Stage manager: Sofiia Fornika
  - Marketing: Anhelina Bocharova
  - Social media: Danyil Kuzmin

  The performance on 28 September is a co-production of the independent Bentegy Theatre, the NASHi Experimental Theatre Club and Community Café.
