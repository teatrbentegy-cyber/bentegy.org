body_uk: '2 вересня 2026 року в київському просторі «Хора» відбудеться прем’єра «Кінця зміни» — першої постановки театрального проєкту «Межа» і дебютної режисерської роботи повного формату хореографа Владислава Дирди. На сцені працюють п’ятнадцятеро виконавців — масштаб, з яким український незалежний сектор береться працювати рідко.


  Роботу створено поза інституціями: без державного фінансування, грантів і підтримки стаціонарного театру. Постановка тривала близько семи місяців — разом це близько 300 годин репетиційної роботи.


  ## Що всередині роботи


  «Кінець зміни» досліджує механіку згоди: момент, коли тиск групи стає сильнішим за власне рішення людини. Відправна точка — суфійська притча «Як змінилася вода»: у місто привозять нову воду, і всі, хто її п’є, змінюються разом із нею. Одна відмовляється пити — і поступово чужою для решти стає саме вона.


  Композиційно вистава побудована на співвідношенні приблизно 30 відсотків індивідуальних партій до 70 відсотків групових структур. Саме ця пропорція створює постійний тиск поля, всередині якого перебуває та, хто ще опирається.


  Драматургія тримається на предметній дії: вода, коромисло з відрами, крапельниці, дев’ять дерев’яних палиць, з яких у фіналі виростає конструкція, і рожеві окуляри як маркер прийнятої норми. Звукова партитура поєднує ambient та industrial із тишею й натуральними звуками: крапання води закільцьовує фінал.


  > «Наш свідомий вибір знаходиться всередині нас самих. „Кінець зміни“ ґрунтується на гострій соціальній темі вибору та його наслідків. З цим стикався кожен — тому для мене важливо про це говорити через призму тіла, пластики, світла й музики», — Владислав Дирда, хореограф-постановник.


  ## Контекст


  Вистава говорить про механізм, який діє в будь-якому суспільстві: як група непомітно переписує рішення окремої людини. Відсутність словесного тексту робить роботу доступною для нечуючих глядачів та іноземців без жодної адаптації.


  До прем’єри команда провела відкриті репетиції та два work-in-progress покази — 24 травня і 4 липня 2026 року.


  ## Довідка


  **Владислав Дирда** — хореограф, постановник і викладач contemporary dance. Автор пластичних вистав «Аліса в Країні див» (2023) та «Ніч перед Різдвом» (2024).


  **Театральний проєкт «Межа»** працює у сфері пластичного та фізичного театру, де рух, ритм і предметна дія є основними засобами висловлювання.


  **Виконавці:** Анна Кочубей, Яна Хамула, Іва Іванова, Марія Шпак, Ліза Силяк, Софія Домашева, Ліза Комісарова, Дарина Коверзюк, Іван Кріль, Мирослава Панчук, Анастасія Синельникова, Юлія Ляшок, Вікторія Квасницька, Лілія Іващенко, Катерина Васик.


  Продюсер — Павло Коваль, незалежний театр Бентеги.


  ## Деталі показу


  - **Дата й час:** 2 вересня 2026, покази о 18:30 та 20:30

  - **Місце:** простір «Хора», вул. Бульварно-Кудрявська, 22, Київ

  - **Формат:** 60 хвилин, один акт, без слів

