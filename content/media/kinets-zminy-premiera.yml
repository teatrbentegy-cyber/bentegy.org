title_uk: У Києві дебютує нова незалежна танцювальна компанія — одразу з ансамблем на п’ятнадцятьох виконавців
title_en: A new independent dance company debuts in Kyiv with an ensemble of fifteen performers
lead_uk: Театральний проєкт «Межа» показує першу роботу 2 вересня 2026 у просторі «Хора». «Кінець зміни» створено за сім місяців без інституційного та державного фінансування.
lead_en: Theatre project Mezha shows its first work, End of Shift, at Khora on 2 September 2026. It was made over seven months without institutional or state funding.
