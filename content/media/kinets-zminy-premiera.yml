body_en: |
  On 2 September 2026, Chora Stage in Kyiv hosts the premiere of End of Shift, the first production by the theatre project Mezha and the first full-length piece directed by choreographer Vladyslav Dyrda. Fifteen performers work on stage, a scale the Ukrainian independent sector rarely takes on.

  The work was made outside institutions: with no state funding, no grants and no support from a repertory theatre. The production took around seven months, some 300 hours of rehearsal in total.

  ## Inside the work

  End of Shift explores the mechanics of consent: the moment when group pressure becomes stronger than a person’s own decision. The starting point is the Sufi parable “When the Waters Were Changed”: new water is brought to a town, and everyone who drinks it changes with it. One woman refuses to drink, and gradually it is she who becomes a stranger to everyone else.

  The composition rests on a ratio of roughly 30 per cent solo material to 70 per cent group structures. That proportion creates the constant pressure of the field surrounding the one who still resists.

  The dramaturgy is carried by action with objects: water, a yoke with buckets, IV drips, nine wooden poles that grow into a structure in the finale, and pink glasses as the marker of an accepted norm. The sound score combines ambient and industrial music with silence and natural sound: dripping water closes the loop of the finale.

  > “Our conscious choice lies within ourselves. End of Shift is built on the sharp social theme of choice and its consequences. Everyone has faced it, so for me it matters to speak about it through the body, movement, light and music,” says Vladyslav Dyrda, choreographer and director.

  ## Context

  The piece speaks about a mechanism at work in any society: how a group quietly rewrites the decision of an individual. With no spoken text, the work is accessible to Deaf audiences and to international audiences without any adaptation.

  Before the premiere, the team held open rehearsals and two work-in-progress showings, on 24 May and 4 July 2026.

  ## Background

  **Vladyslav Dyrda** is a choreographer, director and contemporary dance teacher. He created the movement-theatre productions Alice in Wonderland (2023) and The Night Before Christmas (2024).

  **Theatre project Mezha** works in movement-based and physical theatre, where movement, rhythm and action with objects are the main means of expression.

  **Performers:** Anna Kochubei, Yana Khamula, Iva Ivanova, Mariia Shpak, Liza Syliak, Sofiia Domasheva, Liza Komisarova, Daryna Koverziuk, Ivan Kril, Myroslava Panchuk, Anastasiia Synelnykova, Yuliia Liashok, Viktoriia Kvasnytska, Liliia Ivashchenko, Kateryna Vasyk.

  Producer: Pavlo Koval, Bentegy Theatre.

  ## Performance details

  - **Date and time:** 2 September 2026, performances at 18:30 and 20:30
  - **Venue:** Chora Stage, 22 Bulvarno-Kudriavska St., Kyiv
  - **Format:** 60 minutes, one act, no words
