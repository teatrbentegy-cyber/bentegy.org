title_uk: 'НАОСЛІП: 7 серпня незалежні театри чотирьох міст уперше зберуться в Києві'
title_en: 'NAOSLIP: independent theatres from four cities meet in Kyiv on 7 August'
lead_uk: '7 серпня у просторі КультМотив на Подолі театри з Києва, Харкова, Львова та Луцька зберуться на відкриту зустріч НАОСЛІП. Того ж вечора — відкритий пітчинг молодих митців: виставу-переможницю Бентеги профінансують і випустять.'
lead_en: On 7 August, theatres from Kyiv, Kharkiv, Lviv and Lutsk meet at KultMotyv for NAOSLIP, an open gathering. The same evening hosts an open pitch for young artists; Bentegy will fund and produce the winner.
cover: /uploads/naoslip-talk.jpg
body_uk: 'Київ, 30 липня 2026. Незалежний театр в Україні існує як десятки окремих локальних історій: колективи працюють у своїх містах, без державної підтримки й майже без зв’язків одне з одним. 7 серпня у просторі КультМотив на Подолі театри з Києва, Харкова, Львова та Луцька зберуться на НАОСЛІП — відкриту зустріч, яку ініціює київський театр Бентеги. Того ж вечора оголосять переможця відкритого пітчингу молодих митців: його виставу Бентеги профінансують і випустять.


  Ціна роз’єднаності вимірюється конкретно. Вистава виходить, збирає кілька показів у своєму місті й зникає: її нікуди повезти, ні з ким обмінятися, і спільної афіші, яка донесла б її за межі одного міста, бракує. Кожна нова команда починає з нуля — сама шукає майданчик, сама збирає глядача.


  Війна поглибила ізоляцію. Про це свідчать відповіді театрів у відкритому опитуванні «Карта незалежного театру України», яке з липня проводять Бентеги. У прифронтовому Харкові колективи щоразу обирають між доступним простором і безпекою глядачів. В одеському театрі на фронт пішов директор разом із частиною команди. Львівський колектив цьогоріч закрив власну громадську організацію, бо бюрократія забирала більше сил, ніж давала можливостей. Попри це театри продовжують працювати: саме тут з’являється значна частина нових режисерів, драматургів та експериментальних форм.


  Спроби описати сектор уже були: у 2018 році постала Гільдія незалежних театрів і вийшло дослідження «Український театр: шлях до себе» ГО «Культурна Асамблея». Далі були пандемія та повномасштабне вторгнення, і системного опитування самих театрів відтоді не проводили.


  НАОСЛІП — початок тривалої роботи. Театри вперше покажуть свої вистави одне одному, познайомляться особисто й публічно обговорять власні умови роботи. Остання третина розмови відведена на питання із залу. Підґрунтям для дискусії стануть свідчення колективів із Харкова, Одеси, Львова та Луцька.


  > «Незалежний театр в Україні досі лишається набором локальних історій. Спроби об’єднатися були, але сталого середовища так і не виникло — тож ми беремося за цю роботу самі. Спершу треба хоча б побачити одне одного й чесно назвати, в яких умовах ми працюємо», — Павло Коваль, засновник і продюсер театру Бентеги.


  ## Довідково


  - **Дата й час:** 7 серпня 2026, 16:00–23:00

  - **Місце:** простір КультМотив, вул. Набережно-Хрещатицька, 31/36, Київ

  - **Учасники:** театри НАШі (Київ), Химери (Харків), Лава (Львів), Гармидер (Луцьк), Бентеги (Київ)

  - **Партнери:** КультМотив, Quests, «Пішли в театр»

  '
body_en: |
  Kyiv, 30 July 2026. Independent theatre in Ukraine exists as dozens of separate local stories: companies work in their own cities, without state support and with almost no ties to one another. On 7 August, at the KultMotyv space in Podil, theatres from Kyiv, Kharkiv, Lviv and Lutsk will meet at NAOSLIP, an open gathering initiated by Kyiv’s Bentegy Theatre. The same evening, the winner of an open pitch for young artists will be announced: Bentegy will fund and produce the winning production.

  The cost of disconnection can be measured precisely. A production opens, plays a few performances in its own city and disappears: there is nowhere to tour it, no one to exchange with, and no shared listing that would carry it beyond a single city. Every new company starts from zero, finding a venue and building an audience on its own.

  The war has deepened the isolation. This is clear from theatres’ answers to the open survey “Map of Independent Theatre in Ukraine”, which Bentegy has been running since July. In frontline Kharkiv, companies choose every time between an accessible space and the safety of their audience. At one theatre in Odesa, the director went to the front together with part of the team. A Lviv company closed its own NGO this year because the bureaucracy took more energy than it gave in opportunities. Even so, theatres keep working: this is where a significant share of new directors, playwrights and experimental forms emerge.

  There have been attempts to describe the sector: in 2018 the Guild of Independent Theatres was founded and the NGO Cultural Assembly published the study “Ukrainian Theatre: The Way to Itself”. Then came the pandemic and the full-scale invasion, and no systematic survey of the theatres themselves has been carried out since.

  NAOSLIP is the beginning of long-term work. The theatres will show their productions to one another for the first time, meet in person and publicly discuss their own working conditions. The final third of the conversation is given to questions from the floor. The discussion will draw on testimonies from companies in Kharkiv, Odesa, Lviv and Lutsk.

  > “Independent theatre in Ukraine is still a collection of local stories. There have been attempts to unite, but a sustainable community never took shape, so we are taking on this work ourselves. First we need at least to see one another and honestly name the conditions we work in,” says Pavlo Koval, founder and producer of Bentegy Theatre.

  ## Key details

  - **Date and time:** 7 August 2026, 16:00–23:00
  - **Venue:** KultMotyv, 31/36 Naberezhno-Khreshchatytska St., Kyiv
  - **Participants:** NASHi (Kyiv), Khymery (Kharkiv), Lava (Lviv), Harmyder (Lutsk), Bentegy (Kyiv)
  - **Partners:** KultMotyv, Quests, Pishly v teatr
