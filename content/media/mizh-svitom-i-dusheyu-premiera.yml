body_uk: '**Коли слів не вистачає, залишається тіло.**


  Незалежний київський театр Бентеги 11 та 12 червня 2026 представляє прем’єру монодрами «Між Світом і Душею». Майданчик — Collider (вул. Кирилівська, 60), Київ. Два покази.


  ## Про що ця вистава


  «Між Світом і Душею» — фізичне дослідження стану: що відбувається з людиною, якій система відібрала все — і яка все одно залишилась собою? Постать Василя Стуса тут — точка входу, а не біографічна реконструкція.


  Є один актор. Є бетонний холодний простір. Є дві дерев’яні дошки, що поступово перетворюються: з будматеріалу — на ґрати, клітку і зрештою хрест. І є питання, яке глядач чує впритул: чи варто було?


  Сьогодні в Україні це питання конкретне. Кожен відповідає на нього по-своєму — залишившись, поїхавши, воюючи, чекаючи. «Між Світом і Душею» — простір, де це можна прожити без висновків і без розради.


  > «Сьогодні українське суспільство живе у стані колективного виснаження. Але майже ніхто не говорить про те, що відбувається з людиною, коли вона залишається наодинці із собою після пережитого. Саме з цим працює ця вистава», — Павло Коваль, режисер.


  ## Метод


  Вистава побудована на методі японського режисера Тадаші Сузукі — системі фізичного театру, де актор працює на межі тілесних можливостей. Саме ця межа стає видимою для глядача: чутно дихання, відчувається втома, кожна пауза має вагу. Вистава будувалась у Collider, де індустріальна архітектура стає частиною мови вистави.


  ## Команда


  Режисер і продюсер — Павло Коваль. Актор — Антон Старостін, практик фізичного театру, учасник інтенсивних тренінгів за методом Сузукі.


  ## Деталі


  - **Дати:** 11 червня 2026, 19:00 — прем’єра; 12 червня 2026, 19:00

  - **Місце:** Collider (вул. Кирилівська, 60), Київ, сайт-специфічний формат

  '
