body_en: |
  **When words run out, the body remains.**

  On 11 and 12 June 2026, the independent Kyiv company Bentegy Theatre premieres the solo performance Between the World and the Soul. The venue is Collider (60 Kyrylivska St.), Kyiv. Two performances.

  ## What the production is about

  Between the World and the Soul is a physical study of a state: what happens to a person from whom the system has taken everything, and who has nonetheless remained themselves? The figure of Vasyl Stus is a point of entry here, not a biographical reconstruction.

  There is one actor. There is a cold concrete space. There are two wooden planks that gradually transform: from building material into bars, a cage and finally a cross. And there is a question the audience hears at close range: was it worth it?

  In Ukraine today this question is concrete. Everyone answers it in their own way, by staying, leaving, fighting, waiting. Between the World and the Soul is a space where it can be lived through without conclusions and without consolation.

  > “Ukrainian society today lives in a state of collective exhaustion. But almost no one talks about what happens to a person when they are left alone with themselves after what they have lived through. That is what this production works with,” says Pavlo Koval, director.

  ## The method

  The production is built on the method of Japanese director Tadashi Suzuki, a system of physical theatre in which the actor works at the limit of the body’s capacity. That limit becomes visible to the audience: you can hear the breathing, feel the fatigue, and every pause carries weight. The production was made at Collider, where the industrial architecture becomes part of its language.

  ## The team

  Director and producer: Pavlo Koval. Actor: Anton Starostin, a physical theatre practitioner who has taken part in intensive Suzuki method training.

  ## Details

  - **Dates:** 11 June 2026, 19:00, premiere; 12 June 2026, 19:00
  - **Venue:** Collider (60 Kyrylivska St.), Kyiv, site-specific format
