title_uk: Що незалежні театри можуть зробити одне для одного. Кейс «Коней за вікном»
title_en: 'What independent theatres can do for one another: the case of Horses Outside the Window'
lead_uk: Як відкритий пітчинг молодих команд на НАОСЛІП перетворився на прем’єру вистави за Матеєм Вішнєком і чого цей досвід вчить незалежний театр.
lead_en: How an open pitch for emerging companies at NAOSLIP became the premiere of a production of Matei Vișniec’s play, and what this teaches independent theatre.
body_uk: '7 серпня в київському «КультМотиві» понад 250 глядачів слухали, як незалежні театри з чотирьох міст говорять про себе: «Гармидер» із Луцька, «Химери» з Харкова, «Лава» зі Львова, експериментальний театральний клуб «НАШі» з Києва. Ту розмову докладно переказало [Суспільне Культура](https://suspilne.media/culture/1402828-performativnij-sektor-najtoksicnisij-v-ukraini-pro-so-govorili-nezalezni-teatri-z-kieva-lvova-harkova-ta-lucka/).


  Анастасія Іванес із «Лави» описала стан сектору трьома словами: «Голод, безгрошів''я і тотальна виснаженість». Валерій Левчук-Нетецький із «Химер» запитав: «Чи можемо ми створити спільноту — не асоціацію, а спільноту». Романа Ізабела Соутус із «НАШих» говорила про те, що театрам треба «перетрансформувати ту культуру конкуренції, яка існує»: нас навчили, що глядачів мало, тож колеги змагаються там, де могли б підтримувати одне одного.


  ## Список, який ми знаємо напам''ять


  Цей список сектор складає давно. 2018 року Гільдія незалежних театрів України замовила дослідження «Український театр: шлях до себе», яке провела ГО «Культурна Асамблея» за підтримки Українського культурного фонду. Минуло вісім років, пандемія і повномасштабне вторгнення, а його рекомендації так і лишилися на папері. Приватні театри в Україні досі працюють без власних приміщень. На дискусії в «КультМотиві» знову прозвучав той самий перелік: ізоляція, безгрошів''я, брак майданчиків і системності, виснаження.


  Після дискусії я сказав Суспільному, що наступного разу хочу почути за цим столом про те, що ми вже зробили одне для одного. Цей текст — перший такий звіт.


  ## Пітчинг: рішення за один вечір


  Дискусія була частиною НАОСЛІПу, вечора, яким театр Бентеги відкривав свій перший сезон. У межах НАОСЛІПу ми провели відкритий мистецький пітчинг для молодих команд. Матеріал Суспільного зосередився на розмові театрів, і пітчинг лишився за кадром, хоча саме з нього почалася історія, про яку я пишу.


  Пітчинг ми обрали свідомо. Молода команда отримує відповідь за один вечір, публічно, перед залом і колегами, замість місяців очікування результатів конкурсу. А театр бере на себе відповідальність за свій вибір так само публічно.


  Переміг проєкт «Коні за вікном» за п''єсою румунського драматурга Матея Вішнєка. Це вистава студентів Київського національного університету театру, кіно і телебачення імені І. К. Карпенка-Карого, нині четвертокурсників майстерні народної артистки України Наталії Долі. Режисер вистави — їхній викладач Євген Щербань. Пітчили самі студенти.


  ## Команда, яка вже вміла працювати сама


  Ця команда прийшла на пітчинг із досвідом, якого бракує багатьом професійним колективам. Виконавці вже працювали на професійній сцені. Цю виставу вони вивели за межі університету власними силами: організували незалежний показ і самі продали на нього квитки.


  Тобто вони довели головне ще до нас: глядач купує квиток на їхню роботу. Їм потрібна була інфраструктура, і саме її незалежний театр здатен дати.


  ## Що може віддати театр без власної будівлі


  Ми віддали те, що маємо. Продюсерську роботу. Домовленість із простором «Хора», де прем''єрний показ відбудеться в залі на 110 місць. Квиткову систему і цінову політику. Промо, роботу з пресою і з глядачем.


  Окремою частиною роботи став протокол турботи про глядача. «Коні за вікном» говорять про війну і втрату близьких, і на work-in-progress показі в залі сиділи ветерани. Тому до купівлі квитка глядач бачить розгорнуте попередження про зміст, звук і світло; учасники бойових дій отримують квиток безкоштовно; укриття розташоване в тій самій будівлі.


  Усе, що стосується самої вистави, лишається за командою: художні рішення, склад, авторство. Між пітчингом і прем''єрою — 72 дні.


  ## Найважче — правила


  Співпраця двох незалежних структур — це щоденні перемовини. Хто що вирішує. Як рахуються гроші. Як оформлюються права на п''єсу, переклад, ім''я і зображення виконавців. Де закінчується продюсування і починається вистава. Готових відповідей на ці питання в секторі поки що бракує, тож ми прописуємо їх для себе по ходу і фіксуємо письмово.


  Як на мене, саме ця робота і є відповіддю на питання Левчука-Нетецького. Спільнота починається там, де один театр вкладає свій ресурс у роботу іншої команди й домовляється з нею про правила. І саме так, на практиці, виглядає та трансформація культури конкуренції, про яку говорила Соутус.


  ## Про що вистава


  Сама команда описує свою роботу як виставу-ритуал про жагу до життя й ставить глядачеві питання: що робить людина, коли навколо неї руйнується світ?


  У п''єсі Вішнєка три домівки і три жінки: мати, донька, дружина. До кожної приходить той самий Посильний зі звісткою з полку. Матері він дарує гвоздики, зібрані «в розташуванні полку», і дає поради щодо чобіт. Мати тим часом говорить про ґудзики кітеля й крихти в щілинах підлоги, а син прислухається до коня, який ходить довкола будинку. Між сценами Посильний виходить до рампи й зачитує мирні угоди: хто бере Хорватію, хто втрачає Ельзас.


  Вішнєк — драматург, п''єси якого відхиляла цензура комуністичної Румунії. 1987 року він попросив політичного притулку у Франції, а 1992-го саме «Коні за вікном» відкрили йому міжнародну сцену. Команда отримала права на постановку напряму від автора й зробила власний український переклад.


  ## Пропозиція колегам


  Прем''єрний показ «Коней за вікном» відбувся 18 жовтня у просторі «Хора».


  А колегам пропоную просту річ. Проведіть свій пітчинг. Віддайте свій продюсерський ресурс одній команді, яка вже довела, що вміє працювати сама. І наступного разу за тим самим столом розкажімо одне одному, що з цього вийшло.

  '
body_en: |
  On 7 August, at KultMotyv in Kyiv, more than 250 people listened as independent theatres from four cities talked about themselves: Harmyder from Lutsk, Khymery from Kharkiv, Lava from Lviv and the NASHi Experimental Theatre Club from Kyiv. [Suspilne Culture](https://suspilne.media/culture/1402828-performativnij-sektor-najtoksicnisij-v-ukraini-pro-so-govorili-nezalezni-teatri-z-kieva-lvova-harkova-ta-lucka/) gave a detailed account of that conversation (in Ukrainian).

  Anastasiia Ivanes of Lava summed up the state of the sector in three words: “Hunger, no money and total exhaustion.” Valerii Levchuk-Netetskyi of Khymery asked: “Can we create a community: not an association, but a community?” Romana Isabella Soutus of NASHi said theatres need to “transform the culture of competition that exists”: we were taught that audiences are scarce, so colleagues compete where they could be supporting one another.

  ## A list we know by heart

  The sector drew up this list long ago. In 2018 the Guild of Independent Theatres of Ukraine commissioned the study “Ukrainian Theatre: Finding Itself”, carried out by the NGO Cultural Assembly with support from the Ukrainian Cultural Foundation. Eight years, a pandemic and a full-scale invasion later, its recommendations remain on paper. Private theatres in Ukraine still work without buildings of their own. At the discussion at KultMotyv, the same list came up again: isolation, lack of money, a shortage of venues and of any system, exhaustion.

  After the discussion I told Suspilne that next time I want to hear at that table about what we have already done for one another. This text is the first such report.

  ## The pitch: a decision in one evening

  The discussion was part of NAOSLIP, the evening with which Bentegy Theatre opened its first season. As part of NAOSLIP we held an open artistic pitch for emerging companies. Suspilne’s piece focused on the theatres’ conversation, and the pitch stayed off camera, even though it is where the story I am writing about began.

  We chose a pitch deliberately. An emerging company gets its answer in one evening, in public, in front of an audience and colleagues, instead of waiting months for the results of a competition. And the theatre takes responsibility for its choice just as publicly.

  The winner was Horses Outside the Window, after the play by Romanian playwright Matei Vișniec. It is a production by students of the Kyiv National I. K. Karpenko-Karyi University of Theatre, Cinema and Television, now in their fourth year in the studio of People’s Artist of Ukraine Nataliia Dolia. The production is directed by their teacher, Yevhen Shcherban. The students pitched it themselves.

  ## A team that already knew how to work on its own

  This company came to the pitch with experience that many professional companies lack. The performers had already worked on the professional stage. They had taken this production beyond the university on their own: they organised an independent showing and sold the tickets themselves.

  In other words, they had proved the main thing before we came along: audiences buy tickets for their work. What they needed was infrastructure, and that is exactly what independent theatre can give.

  ## What a theatre without a building can give

  We gave what we have. Producing work. An agreement with Chora Stage, where the premiere will take place in a 110-seat hall. A ticketing system and a pricing policy. Promotion, press and audience work.

  A separate part of the work was an audience-care protocol. Horses Outside the Window deals with war and the loss of loved ones, and there were veterans in the audience at the work-in-progress showing. So before buying a ticket, audience members see a detailed content warning covering themes, sound and lighting; combat veterans receive free tickets; and there is a shelter in the same building.

  Everything that concerns the production itself stays with the company: artistic decisions, casting, authorship. Between the pitch and the premiere: 72 days.

  ## The hardest part is the rules

  A collaboration between two independent structures means negotiating every day. Who decides what. How the money is counted. How the rights to the play, the translation, and the performers’ names and images are handled. Where producing ends and the production begins. The sector still has few ready answers to these questions, so we write them out for ourselves as we go and put them on paper.

  As I see it, this work is the answer to Levchuk-Netetskyi’s question. Community begins where one theatre invests its resources in another company’s work and agrees the rules with it. And this, in practice, is what the transformation of the culture of competition that Soutus spoke about looks like.

  ## What the production is about

  The company itself describes its work as a ritual performance about the hunger for life, and puts a question to the audience: what does a person do when the world around them is collapsing?

  Vișniec’s play has three homes and three women: a mother, a daughter, a wife. The same Messenger comes to each with news from the regiment. He gives the Mother carnations picked “at the regiment’s quarters” and offers advice about boots. The Mother, meanwhile, talks about the buttons on a tunic and the crumbs in the cracks of the floor, while the Son listens to a horse walking around the house. Between scenes the Messenger steps to the footlights and reads out peace treaties: who takes Croatia, who loses Alsace.

  Vișniec is a playwright whose plays were rejected by the censors of communist Romania. In 1987 he sought political asylum in France, and in 1992 it was Horses Outside the Window that opened the international stage to him. The company received the staging rights directly from the author and made its own Ukrainian translation.

  ## A proposal to colleagues

  The premiere of Horses Outside the Window took place on 18 October at Chora Stage.

  And to colleagues I propose something simple. Hold your own pitch. Give your producing resources to one company that has already proved it can work on its own. And next time, at the same table, let’s tell one another what came of it.
