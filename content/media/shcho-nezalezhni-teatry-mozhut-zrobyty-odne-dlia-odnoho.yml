title_uk: Що незалежні театри можуть зробити одне для одного. Кейс «Коней за вікном»
title_en: 'What independent theatres can do for one another: the case of Horses Outside the Window'
lead_uk: Як відкритий пітчинг молодих команд на НАОСЛІП перетворився на прем’єру вистави за Матеєм Вішнеком і чого цей досвід вчить незалежний театр.
lead_en: How an open pitch for young teams at NAOSLIP became the premiere of a show based on Matéi Visniec, and what this teaches independent theatre.
body_uk: '7 серпня в київському «Культмотиві» близько 250 глядачів слухали, як незалежні театри з чотирьох міст говорять про себе: «Гармидер» із Луцька, «Химери» з Харкова, «Лава» зі Львова, експериментальний театральний клуб «НАШі» з Києва. Ту розмову докладно переказало [Суспільне Культура](https://suspilne.media/culture/1402828-performativnij-sektor-najtoksicnisij-v-ukraini-pro-so-govorili-nezalezni-teatri-z-kieva-lvova-harkova-ta-lucka/).


  Анастасія Іванес із «Лави» описала стан сектору трьома словами: «Голод, безгрошів''я і тотальна виснаженість». Валерій Левчук-Нетецький із «Химер» запитав: «Чи можемо ми створити спільноту — не асоціацію, а спільноту». Романа Ізабела Соутус із «НАШих» говорила про те, що театрам треба «перетрансформувати ту культуру конкуренції, яка існує»: нас навчили, що глядачів мало, тож колеги змагаються там, де могли б підтримувати одне одного.


  ## Список, який ми знаємо напам''ять


  Цей список сектор складає давно. 2018 року Гільдія незалежних театрів України замовила дослідження «Український театр: шлях до себе», яке провела ГО «Культурна Асамблея» за підтримки Українського культурного фонду. Минуло вісім років, пандемія і повномасштабне вторгнення, а його рекомендації так і лишилися на папері. Приватні театри в Україні досі працюють без власних приміщень. На дискусії в «Культмотиві» знову прозвучав той самий перелік: ізоляція, безгрошів''я, брак майданчиків і системності, виснаження.


  Після дискусії я сказав Суспільному, що наступного разу хочу почути за цим столом про те, що ми вже зробили одне для одного. Цей текст — перший такий звіт.


  ## Пітчинг: рішення за один вечір


  Дискусія була частиною НАОСЛІПу, вечора, яким театр Бентеги відкривав свій перший сезон. У межах НАОСЛІПу ми провели відкритий мистецький пітчинг для молодих команд. Матеріал Суспільного зосередився на розмові театрів, і пітчинг лишився за кадром, хоча саме з нього почалася історія, про яку я пишу.


  Пітчинг ми обрали свідомо. Молода команда отримує відповідь за один вечір, публічно, перед залом і колегами, замість місяців очікування результатів конкурсу. А театр бере на себе відповідальність за свій вибір так само публічно.


  Переміг проєкт «Коні за вікном» за п''єсою румунського драматурга Матея Вішнека. Це вистава студентів Київського національного університету театру, кіно і телебачення імені І. К. Карпенка-Карого, нині четвертокурсників майстерні народної артистки України Наталії Долі. Режисер вистави — їхній викладач Євген Щербань. Пітчили самі студенти.


  ## Команда, яка вже вміла працювати сама


  Ця команда прийшла на пітчинг із досвідом, якого бракує багатьом професійним колективам. Виконавці вже працювали на професійній сцені. Цю виставу вони вивели за межі університету власними силами: організували незалежний показ і самі продали на нього квитки.


  Тобто вони довели головне ще до нас: глядач купує квиток на їхню роботу. Їм потрібна була інфраструктура, і саме її незалежний театр здатен дати.


  ## Що може віддати театр без власної будівлі


  Ми віддали те, що маємо. Продюсерську роботу. Домовленість із простором «Хора», де прем''єрний показ відбудеться в залі на 110 місць. Квиткову систему і цінову політику. Промо, роботу з пресою і з глядачем.


  Окремою частиною роботи став протокол турботи про глядача. «Коні за вікном» говорять про війну і втрату близьких, і на work-in-progress показі в залі сиділи ветерани. Тому до купівлі квитка глядач бачить розгорнуте попередження про зміст, звук і світло; учасники бойових дій отримують квиток безкоштовно; укриття розташоване в тій самій будівлі.


  Усе, що стосується самої вистави, лишається за командою: художні рішення, склад, авторство. Між пітчингом і прем''єрою — 72 дні.


  ## Найважче — правила


  Співпраця двох незалежних структур — це щоденні перемовини. Хто що вирішує. Як рахуються гроші. Як оформлюються права на п''єсу, переклад, ім''я і зображення виконавців. Де закінчується продюсування і починається вистава. Готових відповідей на ці питання в секторі поки що бракує, тож ми прописуємо їх для себе по ходу і фіксуємо письмово.


  Як на мене, саме ця робота і є відповіддю на питання Левчука-Нетецького. Спільнота починається там, де один театр вкладає свій ресурс у роботу іншої команди й домовляється з нею про правила. І саме так, на практиці, виглядає та трансформація культури конкуренції, про яку говорила Соутус.


  ## Про що вистава


  Сама команда описує свою роботу як виставу-ритуал про жагу до життя й ставить глядачеві питання: що робить людина, коли навколо неї руйнується світ?


  У п''єсі Вішнека три домівки і три жінки: мати, донька, дружина. До кожної приходить той самий Посильний зі звісткою з полку. Матері він дарує гвоздики, зібрані «в розташуванні полку», і дає поради щодо чобіт. Мати тим часом говорить про ґудзики кітеля й крихти в щілинах підлоги, а син прислухається до коня, який ходить довкола будинку. Між сценами Посильний виходить до рампи й зачитує мирні угоди: хто бере Хорватію, хто втрачає Ельзас.


  Вішнек — драматург, п''єси якого відхиляла цензура комуністичної Румунії. 1987 року він попросив політичного притулку у Франції, а 1992-го саме «Коні за вікном» відкрили йому міжнародну сцену. Команда отримала права на постановку напряму від автора й зробила власний український переклад.


  ## Пропозиція колегам


  Прем''єрний показ «Коней за вікном» відбувся 18 жовтня у просторі «Хора».


  А колегам пропоную просту річ. Проведіть свій пітчинг. Віддайте свій продюсерський ресурс одній команді, яка вже довела, що вміє працювати сама. І наступного разу за тим самим столом розкажімо одне одному, що з цього вийшло.

