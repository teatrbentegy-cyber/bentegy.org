body_uk: '18 жовтня о 18:00 у просторі «Хора» відбудеться прем’єрний показ вистави «Коні за вікном» за п’єсою Матея Вішнєка. Її створили четвертокурсники КНУТКіТ із майстерні Наталії Долі разом зі своїм викладачем, режисером Євгеном Щербанем. Прем’єру продюсує незалежний театр Бентеги: вистава перемогла в його мистецькому пітчингу НАОСЛІП.


  ## Як з’явилася співпраця


  7 серпня 2026 року в київському «КультМотиві» театр Бентеги провів НАОСЛІП — вечір, яким відкривав свій перший сезон. Близько 250 глядачів побачили дискусію незалежних театрів із Луцька, Харкова, Львова та Києва, а також відкритий мистецький пітчинг для молодих команд. Проєкт «Коні за вікном» на пітчингу представляли самі студенти, і він переміг. Між пітчингом і прем’єрою — 72 дні.


  ## Команда


  Виконавці — студенти Київського національного університету театру, кіно і телебачення імені І. К. Карпенка-Карого, майстерня народної артистки України Наталії Долі. «Коней за вікном» команда вивела за межі університету власними силами: сама організувала незалежний показ і сама продала на нього квитки.


  > «Сама вистава для нас є можливістю говорити про те, що нас хвилює і болить. Наш спосіб висловитися, винести власні переживання до глядача й почати діалог», — Олександра Вершиніна, акторка вистави.


  ## Як влаштована співпраця


  Театр Бентеги бере на себе продюсування прем’єрного показу: домовленість із простором, квиткову систему, промо, роботу з пресою і глядачем. Художні рішення, склад і авторство лишаються за командою. Учасники бойових дій отримують квиток безкоштовно, на сторінці події є розгорнуте попередження про зміст, звук і світло.


  ## Про виставу


  Команда називає свою роботу виставою-ритуалом про жагу до життя. Її головне питання: що робить людина, коли навколо неї руйнується світ?


  У п’єсі Вішнєка три домівки і три жінки: мати, донька, дружина. До кожної приходить той самий Посильний зі звісткою з полку, а за вікном ходить кінь. Абсурд у цій п’єсі тримає цілком упізнаваний досвід: побутові правила як спосіб протриматися, звістку, повернення.


  > «Коли звична мова вже не працює, на авансцену виходить абсурд. Саме тому — Вішнєк. Ми звертаємося до цього „червоного носа“, щоб крізь цинізм часу віднайти те, що досі здатне об’єднувати нас, — людяність», — Євген Щербань, режисер.


  ## Факти


  - **Вистава:** «Коні за вікном» за п’єсою Матея Вішнєка

  - **Режисер:** Євген Щербань

  - **Прем’єрний показ:** 18 жовтня 2026, 18:00

  - **Майданчик:** простір «Хора», вул. Бульварно-Кудрявська, 22, Київ

  - **Тривалість:** 85 хвилин без антракту, 16+

  - **Дійові особи та виконавці:** Посильний — Микита Яворський; Мати — Олександра Вершиніна; Син — Михайло Чайка; Донька — Марія Джан; Батько — Ірина Ралко; Дружина — Ольга Човпило; Чоловік — Данило Волошин; Голуби — Марія Маркіна, Тетяна Дорошенко, Ольга Човпило

