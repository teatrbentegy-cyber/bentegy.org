body_en: |
  On 18 October at 18:00, Chora Stage hosts the premiere of Horses Outside the Window, after the play by Matei Vișniec. It was created by fourth-year students of the Karpenko-Karyi University from Nataliia Dolia’s workshop, together with their teacher, director Yevhen Shcherban. The premiere is produced by the independent Bentegy Theatre: the production won its NAOSLIP artistic pitch.

  ## How the collaboration began

  On 7 August 2026, Bentegy Theatre held NAOSLIP at KultMotyv in Kyiv, the evening that opened its first season. Around 250 people saw a discussion between independent theatres from Lutsk, Kharkiv, Lviv and Kyiv, along with an open artistic pitch for young companies. Horses Outside the Window was presented at the pitch by the students themselves, and it won. Seventy-two days separate the pitch from the premiere.

  ## The team

  The performers are students of the I. K. Karpenko-Karyi Kyiv National University of Theatre, Cinema and Television, from the workshop of People’s Artist of Ukraine Nataliia Dolia. The team took Horses Outside the Window beyond the university on its own: it organised an independent showing and sold the tickets itself.

  > “For us the production is a chance to speak about what worries and hurts us. It is our way of speaking out, bringing our own experience to the audience and starting a dialogue,” says Oleksandra Vershynina, actor.

  ## How the collaboration works

  Bentegy Theatre produces the premiere performance: the venue agreement, ticketing, promotion, press and audience work. Artistic decisions, casting and authorship stay with the company. Combat veterans receive free tickets, and the event page carries a detailed advisory on content, sound and light.

  ## About the production

  The team calls its work a ritual performance about the hunger for life. Its central question: what does a person do when the world around them is collapsing?

  Vișniec’s play has three homes and three women: a mother, a daughter, a wife. The same Messenger comes to each with news from the regiment, and outside the window a horse walks by. The absurd in this play holds an entirely recognisable experience: everyday rules as a way to hold on, the news, the return.

  > “When ordinary language stops working, the absurd steps forward. That is why Vișniec. We turn to this ‘red nose’ to find, through the cynicism of our time, what can still unite us: humanity,” says Yevhen Shcherban, director.

  ## Facts

  - **Production:** Horses Outside the Window, after the play by Matei Vișniec
  - **Director:** Yevhen Shcherban
  - **Premiere:** 18 October 2026, 18:00
  - **Venue:** Chora Stage, 22 Bulvarno-Kudriavska St., Kyiv
  - **Running time:** 85 minutes, no interval, 16+
  - **Characters and cast:** The Messenger: Mykyta Yavorskyi; Mother: Oleksandra Vershynina; Son: Mykhailo Chaika; Daughter: Mariia Dzhan; Father: Iryna Ralko; Wife: Olha Chovpylo; Husband: Danylo Voloshyn; Pigeons: Mariia Markina, Tetiana Doroshenko, Olha Chovpylo
