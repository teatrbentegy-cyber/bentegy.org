title_uk: '«Гра на Вершинці»: театр Бентеги проведе киян уздовж прихованої річки Чоколівки'
title_en: '“The Game on Vershynka”: Bentegy Theatre leads Kyiv residents along a hidden river in Chokolivka'
lead_uk: 23 серпня о 17:00 — перформанс-прогулянка вздовж річки Вершинки, публічна презентація перформативного проєкту The Inferior Play режисерки та перформерки Марічки Гавриш. Вхід вільний, за попередньою реєстрацією.
lead_en: On 23 August at 17:00, a performance walk along the Vershynka river, the public presentation of The Inferior Play, a performative project by director and performer Marichka Havrysh. Free entry with prior registration.
