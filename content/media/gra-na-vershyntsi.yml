body_uk: 'Театр Бентеги запрошує на «Гру на Вершинці» — перформанс-прогулянку вздовж річки Вершинки на Чоколівці. Подія дає можливість пережити спільну пригоду просто неба й побути її співтворцями: між глядачами й діячами тут цілий спектр, і гості самі регулюють міру своєї участі.


  ## Річка, яку оминають поглядом


  Вершинка — невелика річка на Чоколівці, значна частина якої сьогодні прихована в колекторі. У повсякденному житті її скоріше сприймають як канаву чи випадкову деталь ландшафту, і перехожі часто проходять повз. Саме цю «невидиму» частину Києва команда проєкту пропонує побачити по-новому — через гру.


  Гра має на меті вберегти річку від занепаду й забуття, звернувши на неї увагу мешканців міста. А самим гостям вона відкриває новий спосіб взаємодії з простором, з людьми навколо та з власними почуттями.


  ## Що відбуватиметься


  Учасники разом пройдуть ігровим маршрутом уздовж води. Дорогою вони оживлятимуть цю ділянку присутністю, сміхом і рухом, крок за кроком пригадуючи, як це — гратися надворі: переступити поріг соромʼязливості й відчути свободу серед своїх і щойно знайомих. Під час події передбачена взаємодія з водою. Долучитися може кожен, з будь-яким досвідом: кожен сам обирає, наскільки активно грати.


  ## Про проєкт


  The Inferior Play — перформативний проєкт Марічки Гавриш, який досліджує гру як спосіб бути присутніми одне з одним, взаємодіяти та створювати спільний досвід. До гри ми звертаємося тоді, коли шукаємо знання, — коли у спільноті є рівність, свобода та довіра. Досі робота проєкту й відкриті проміжні ігри відбувалися в репетиційній залі. «Гра на Вершинці» вперше виносить це дослідження у міський простір.


  Над «Грою на Вершинці» працюють: авторка ідеї, режисерка та перформерка — Марічка Гавриш; сценографка — Єва Жукалюк; перформери — Роман Рогоза, Анастасія Лисенок, Оля Галицька, Вікторія Цілуйко.


  > «Я тісно познайомилася з річкою Вершинкою, що на Чоколівці — моєму рідному районі. Я хочу познайомити з нею й інших, оживити її присутністю, сміхом, бігом та грою. Хочу, щоб ми пригадали, як це — гратися надворі», — каже авторка ідеї та перформерка проєкту Марічка Гавриш.


  ## Практична інформація


  - **Дата й час:** 23 серпня 2026, 17:00

  - **Точка збору:** вул. Керченська, 3, Київ (Чоколівка)

  - **Тривалість:** орієнтовно 1,5–2 години

  - **Вхід:** вільний, за попередньою реєстрацією; кількість місць обмежена


  Формат передбачає фізичну активність: маршрут пролягає нерівною місцевістю, з тривалою ходьбою та взаємодією з водою. Радимо зручний одяг за погодою, закрите взуття, воду й засіб від комарів.


  ## Про Per Forma


  Проєкт реалізується за підтримки грантової програми Per Forma, яку здійснює платформа Kyiv Contemporary Music Days за підтримки Performing Arts Fund NL та Міністерства освіти, культури та науки Нідерландів. Програма спрямована на розвиток сектору перформативних мистецтв в Україні.


  Можлива акредитація для зйомки та інтервʼю з авторкою — просимо повідомити заздалегідь.

  '
body_en: 'Bentegy Theatre invites you to “The Game on Vershynka”, a performance walk along the Vershynka river in Chokolivka. It is a shared adventure in the open air where guests become co-creators: between audience and performers lies a whole spectrum, and each guest sets their own degree of participation.


  ## A river people overlook


  Vershynka is a small river in Chokolivka, much of it now hidden in a culvert. In everyday life it reads more like a ditch or a random detail of the landscape, and passers-by often walk right past it. The project team invites people to see this “invisible” part of Kyiv anew, through play.


  The game aims to save the river from decline and oblivion by drawing residents’ attention to it. For the guests, it opens a new way of relating to space, to the people around them and to their own feelings.


  ## What happens


  Participants walk a playful route along the water together, bringing this stretch to life with presence, laughter and movement, and step by step remembering what it feels like to play outdoors: to cross the threshold of shyness and feel free among friends and new acquaintances. The event includes interaction with water. Anyone can join, with any experience: everyone chooses how actively to play.


  ## About the project


  The Inferior Play is a performative project by Marichka Havrysh that explores play as a way of being present with one another, interacting and creating shared experience. We turn to play when we are searching for knowledge, when a community holds equality, freedom and trust. Until now the project’s work and open interim games took place in a rehearsal room. “The Game on Vershynka” takes the research into the city for the first time.


  Team: concept, director and performer Marichka Havrysh; set designer Yeva Zhukaliuk; performers Roman Rohoza, Anastasiia Lysenok, Olia Halytska, Viktoriia Tsiluiko.


  > “I got to know the Vershynka river in Chokolivka, my home district, very closely. I want to introduce others to it and bring it to life with presence, laughter, running and play. I want us to remember what it is like to play outdoors,” says Marichka Havrysh, author and performer of the project.


  ## Practical information


  - **Date and time:** 23 August 2026, 17:00

  - **Meeting point:** 3 Kerchenska St, Kyiv (Chokolivka)

  - **Duration:** approx. 1.5–2 hours

  - **Entry:** free, with prior registration; places are limited


  The format involves physical activity: the route crosses uneven ground, with long walking and interaction with water. Comfortable clothes for the weather, closed shoes, water and mosquito repellent are recommended.


  ## About Per Forma


  The project is supported by the Per Forma grant programme run by Kyiv Contemporary Music Days with the support of Performing Arts Fund NL and the Ministry of Education, Culture and Science of the Netherlands, aimed at developing the performing arts sector in Ukraine.


  Accreditation for filming and interviews with the author is available on request in advance.

  '
