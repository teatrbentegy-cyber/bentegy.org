body_uk: 'Сьомого серпня в Києві за одним столом уперше зібралися незалежні театри з чотирьох міст: Луцька, Харкова, Львова і два київські. Я модерував і почав із питання: назвіть два-три ключові проблемні пункти вашої роботи.


  Відповіді я міг би написати сам, не виходячи з дому. Ізоляція. Безгрошів''я. Немає майданчиків. Немає системи. Виснаження.


  2018 року Гільдія незалежних театрів України замовила дослідження «Український театр: шлях до себе». Його провела ГО «Культурна Асамблея» за підтримки Українського культурного фонду — це досі найповніший опис галузі, який замовив собі сам сектор. Там уже зафіксовано: жоден приватний театр в Україні не має власного приміщення. Там уже є рекомендації: створити вільні майданчики й театральні кластери, законодавчо врегулювати передачу сцен державних театрів незалежним у вільні дні, збудувати інфраструктуру службового житла для гастролей.


  Минуло вісім років, пандемія й повномасштабне вторгнення. Не зроблено нічого з цього. І список, який я почув за столом, — той самий.


  Проблема не в тих, хто відповідав. Проблема в питанні. Я попросив назвати те, чого бракує, — і отримав рівно те, що просив. Ми зібралися говорити про ізоляцію й відтворили її: кожен назвав свій дефіцит, і жоден не спитав сусіда, що той із цим робить.


  ## Філософія бідності


  Руслана Порицька, театр «Гармидер», Луцьк:


  > «Ми всі звикли до філософії бідності, що театр має бути убогим. І ми транслюємо це навіть зараз, за цим столом».


  Її ніхто не підхопив. Я в тому числі.


  Якщо вона права, наш список — не діагноз, а звичка. Спосіб описувати себе, вивчений напам''ять за роки, коли іншого способу не було. Дефіцит перестав бути обставиною й став оптикою: ми настільки довго існували в умовах нестачі, що почали через нестачу мислити. І тоді питання вже не в тому, чому немає грошей, а в тому, чому ми навчилися доводити ними свою справжність. Ніби менеджмент підозрілий. Ніби заробляти на культурі — трохи зраджувати мистецтво.


  «Мені часто говорять, що я забагато транслюю успішний успіх, тоді як насправді все набагато складніше», — каже Порицька.


  «Ангар» у Луцьку почався з виграних десяти тисяч доларів, яких вистачило на підлогу й один вхід. Вони поставили жовті двері, покликали місто фотографуватися біля них і оголосили спільнокошт. Зараз при театрі працює майстерня на сто п''ятнадцять дітей, і саме вона дозволяє частині команди займатися лише театром, а не складом.


  > «Ми маємо навчитися мислити наш театр як бізнес-модель. І тоді треба брати відповідальність: вчитися реєструвати ФОП, платити податки, чесно звітувати».


  ## Дві реальності


  Анастасія Іванес, театр «Лава», Львів:


  > «Голод, безгрошів''я і тотальна виснаженість. Отакі три стовпи власного театру».


  Вони не відновили тригодинну виставу, бо неможливо зібрати тринадцять людей, у кожного з яких дві роботи. «Бо вони всі хочуть їсти, вони всі хочуть мати місце, де ночувати».


  «Чи справді мій театр вартий тих зусиль, щоб я працювала на складі чи в дитячому садку й прийшла у свій єдиний вихідний робити виставу на три години?»


  Одна не скасовує іншу. Незалежний театр в Україні одночасно живе в обох реальностях.


  У «Гармидеру» двадцять два роки роботи й репутація, яка дозволила зібрати навколо себе місто. У «Лави» — другий сезон і люди, які фізично не можуть прийти на репетицію, бо в них дві роботи. Між цими точками немає готової дороги. І ніхто не передає її тим, хто приходить після.


  ## Конкуренцію нам поставили в освіті


  Романа Ізабела Соутус, Експериментальний театральний клуб «НАШі»:


  > «Багато інституцій давно навчили митців, що є дуже маленька обмежена кількість глядачів. Якщо ці глядачі йдуть до когось іншого, то вони не йдуть до вас».


  «Ця конкуренція створюється ще в школі, бо акторам кажуть, що ви є конкурентами одне одному. Потім це переходить на режисуру».


  Валерій Левчук-Нетецький, театр «Химери», Харків: «Коли ти зі своїм актором не співпрацюєш на ролі як співтворці, а ворогуєте за цю роль».


  Я останні місяці регулярно чую від знайомих з інших мистецьких галузей, що перформативний сектор — найтоксичніший в Україні. Сперечатися складно.


  Але тут виникає проста арифметична помилка. Незалежні театри не ділять одного глядача. Їхній спільний ресурс — люди, які взагалі ще не ходять у незалежний театр. Якщо хтось уперше сходив у «Гармидер» у Луцьку, це підвищує шанси «Лави» у Львові й «Химер» у Харкові.


  Ми не ділимо глядача — ми його створюємо.


  Конкурувати в секторі такого розміру — не етична помилка, а управлінська.


  Соутус: «Є багато людей, які працюють у театрі, що не люблять театр — вони люблять себе».


  ## Половина залу


  Із понад двохсот п''ятдесяти присутніх приблизно половина не працює в театрі професійно. Соутус розвернулася до них:


  > «У вас існує величезна сила. Велика причина, чому багато хто з нас має додатково працювати, — у тому, що ми не можемо продати квитки. Якщо цінності, про які ми тут говоримо, для вас важливі — підтримати незалежний театр є продовженням цієї цінності».


  Вона згадала La MaMa — нью-йоркський експериментальний театр, де працювала. Його заснувала 1961 року Еллен Стюарт, дизайнерка з Saks Fifth Avenue, яка не мала жодного театрального досвіду. Перший майданчик був підвалом у прибутковому будинку, а митців, які там працювали, Стюарт роками фінансувала зі своєї зарплати дизайнерки.


  «Ситуація була така сама, у якій ми зараз. Що змінилося? Люди зрозуміли, що мають підтримувати одне одного».


  Інфраструктуру там ніхто не видав готовою. Її зробили ті самі люди, які потім у ній працювали. Те саме зробив «Гармидер» із промзоною в Луцьку.


  Це також переставляє глядача з кінця ланцюжка в середину. Не споживач продукту, а частина системи, без якої продукту не буде.


  ## Асоціація не працює. Двічі


  Гільдія незалежних театрів України з''явилася 2018 року — і саме вона замовила те дослідження, рекомендації якого досі не виконано. Про асоціацію Порицька каже, що була присутня і при її створенні, і при, за її словами, травматичному й нищівному завершенні.


  Левчук-Нетецький: «Вона існувала здебільшого фіктивно, бо навіть якщо ти дотичний до неї, ти з цього нічого не маєш».


  Я не бачу сенсу зараз створювати третю. Щоб така структура працювала, за нею має стояти штат і бюджет. Інакше ми отримаємо ще один список членів без наслідків.


  Він же сформулював альтернативу:


  > «Якби в мене хоч хтось був, досвідчена людина, яка просто пояснила б найдурніше питання, — мій театр на початках стільки помилок не пережив би. Чи можемо ми створити спільноту, не асоціацію?»


  Можливо, саме тут ми нарешті назвали те, що зазвичай ховаємо за словом «безгрошів''я»: у нас майже немає інфраструктури взаємодії. Способу дізнатися, що твою проблему хтось вирішив два міста тому.


  ## Ми вже маємо ресурси


  На панелі прозвучали речі, які не потребують ні статуту, ні реєстрації.


  «Гармидер» із січня запускає з театром «Зміни» форум-театр про внутрішні конфлікти колективів і пропонує ділитися результатами. «Лава» будує у Львові спільну сцену для різних акторських курсів і хоче приймати театри з інших міст. Іванес запропонувала писати гранти спільно. Левчук-Нетецький — горизонтальне менторство.


  І чотири питання, які я поставив зі сцени й на які досі немає причини відповідати «ні». Чому ми не можемо разом спродюсувати чийсь показ у Києві. Чому «Лава» не може дати майданчик у Львові. Чому «Гармидер» не може прийняти когось на резиденцію. Чому кожна нова команда проходить наосліп те, що хтось уже пройшов.


  Ми справді говорили не про те.


  Не тому, що гроші, майданчики, виснаження чи відсутність системи — не проблеми. Вони проблеми. Але якщо через вісім років ми все ще можемо відтворити той самий список, а рекомендації, написані для нас же, лежать невиконаними, — можливо, настав час перестати цей список просто повторювати.


  Питання вже не тільки в тому, чого нам бракує. Питання в тому, чому ми досі не використовуємо те, що вже є одне в одного.


  Наступного разу я хочу почути за цим столом не список того, чого нам бракує, а список того, що ми вже зробили одне для одного.

  '
