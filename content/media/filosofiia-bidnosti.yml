title_en: The Philosophy of Poverty
lead_uk: Незалежні театри чотирьох міст уперше сіли за один стіл — і відтворили список проблем, який сектор знає напам’ять із 2018 року. Колонка модератора розмови на НАОСЛІПі.
lead_en: Independent theatres from four cities sat at one table for the first time and reproduced a list of problems the sector has known by heart since 2018. A column by the moderator of the NAOSLIP conversation.
