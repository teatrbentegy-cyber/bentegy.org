cover_caption_en: NAOSLIP, 7 August 2026
body_uk: |
  Сьомого серпня в Києві за одним столом уперше зібралися незалежні театри з чотирьох міст: Луцька, Харкова, Львова і два київські. Я модерував і почав із питання: назвіть два-три ключові проблемні пункти вашої роботи.

  Відповіді я міг би написати сам, не виходячи з дому. Ізоляція. Безгрошів'я. Немає майданчиків. Немає системи. Виснаження.

  2018 року Гільдія незалежних театрів України замовила дослідження «Український театр: шлях до себе». Його провела ГО «Культурна Асамблея» за підтримки Українського культурного фонду — це досі найповніший опис галузі, який замовив собі сам сектор. Там уже зафіксовано: жоден приватний театр в Україні не має власного приміщення. Там уже є рекомендації: створити вільні майданчики й театральні кластери, законодавчо врегулювати передачу сцен державних театрів незалежним у вільні дні, збудувати інфраструктуру службового житла для гастролей.

  Минуло вісім років, пандемія й повномасштабне вторгнення. Не зроблено нічого з цього. І список, який я почув за столом, — той самий.

  Проблема не в тих, хто відповідав. Проблема в питанні. Я попросив назвати те, чого бракує, — і отримав рівно те, що просив. Ми зібралися говорити про ізоляцію й відтворили її: кожен назвав свій дефіцит, і жоден не спитав сусіда, що той із цим робить.

  ## Філософія бідності

  Руслана Порицька, театр «Гармидер», Луцьк:

  «Ми всі звикли до філософії бідності, що театр має бути убогим. І ми транслюємо це навіть зараз, за цим столом».

  Її ніхто не підхопив. Я в тому числі.

  Якщо вона права, наш список — не діагноз, а звичка. Спосіб описувати себе, вивчений напам'ять за роки, коли іншого способу не було. Дефіцит перестав бути обставиною й став оптикою: ми настільки довго існували в умовах нестачі, що почали через нестачу мислити. І тоді питання вже не в тому, чому немає грошей, а в тому, чому ми навчилися доводити ними свою справжність. Ніби менеджмент підозрілий. Ніби заробляти на культурі — трохи зраджувати мистецтво.

  «Мені часто говорять, що я забагато транслюю успішний успіх, тоді як насправді все набагато складніше», — каже Порицька.

  «Ангар» у Луцьку почався з виграних десяти тисяч доларів, яких вистачило на підлогу й один вхід. Вони поставили жовті двері, покликали місто фотографуватися біля них і оголосили спільнокошт. Зараз при театрі працює майстерня на сто п'ятнадцять дітей, і саме вона дозволяє частині команди займатися лише театром, а не складом.

  «Ми маємо навчитися мислити наш театр як бізнес-модель. І тоді треба брати відповідальність: вчитися реєструвати ФОП, платити податки, чесно звітувати».

  ## Дві реальності

  Анастасія Іванес, театр «Лава», Львів:

  «Голод, безгрошів'я і тотальна виснаженість. Отакі три стовпи власного театру».

  Вони не відновили тригодинну виставу, бо неможливо зібрати тринадцять людей, у кожного з яких дві роботи. «Бо вони всі хочуть їсти, вони всі хочуть мати місце, де ночувати».

  «Чи справді мій театр вартий тих зусиль, щоб я працювала на складі чи в дитячому садку й прийшла у свій єдиний вихідний робити виставу на три години?»

  Одна не скасовує іншу. Незалежний театр в Україні одночасно живе в обох реальностях.

  У «Гармидеру» двадцять два роки роботи й репутація, яка дозволила зібрати навколо себе місто. У «Лави» — другий сезон і люди, які фізично не можуть прийти на репетицію, бо в них дві роботи. Між цими точками немає готової дороги. І ніхто не передає її тим, хто приходить після.

  ## Конкуренцію нам поставили в освіті

  Романа Ізабела Соутус, Експериментальний театральний клуб «НАШі»:

  «Багато інституцій давно навчили митців, що є дуже маленька обмежена кількість глядачів. Якщо ці глядачі йдуть до когось іншого, то вони не йдуть до вас».

  «Ця конкуренція створюється ще в школі, бо акторам кажуть, що ви є конкурентами одне одному. Потім це переходить на режисуру».

  Валерій Левчук-Нетецький, театр «Химери», Харків: «Коли ти зі своїм актором не співпрацюєш на ролі як співтворці, а ворогуєте за цю роль».

  Я останні місяці регулярно чую від знайомих з інших мистецьких галузей, що перформативний сектор — найтоксичніший в Україні. Сперечатися складно.

  Але тут виникає проста арифметична помилка. Незалежні театри не ділять одного глядача. Їхній спільний ресурс — люди, які взагалі ще не ходять у незалежний театр. Якщо хтось уперше сходив у «Гармидер» у Луцьку, це підвищує шанси «Лави» у Львові й «Химер» у Харкові.

  Ми не ділимо глядача — ми його створюємо.

  Конкурувати в секторі такого розміру — не етична помилка, а управлінська.

  Соутус: «Є багато людей, які працюють у театрі, що не люблять театр — вони люблять себе».

  ## Половина залу

  Із понад двохсот п'ятдесяти присутніх приблизно половина не працює в театрі професійно. Соутус розвернулася до них:

  «У вас існує величезна сила. Велика причина, чому багато хто з нас має додатково працювати, — у тому, що ми не можемо продати квитки. Якщо цінності, про які ми тут говоримо, для вас важливі — підтримати незалежний театр є продовженням цієї цінності».

  Вона згадала La MaMa — нью-йоркський експериментальний театр, де працювала. Його заснувала 1961 року Еллен Стюарт, дизайнерка з Saks Fifth Avenue, яка не мала жодного театрального досвіду. Перший майданчик був підвалом у прибутковому будинку, а митців, які там працювали, Стюарт роками фінансувала зі своєї зарплати дизайнерки.

  «Ситуація була така сама, у якій ми зараз. Що змінилося? Люди зрозуміли, що мають підтримувати одне одного».

  Інфраструктуру там ніхто не видав готовою. Її зробили ті самі люди, які потім у ній працювали. Те саме зробив «Гармидер» із промзоною в Луцьку.

  Це також переставляє глядача з кінця ланцюжка в середину. Не споживач продукту, а частина системи, без якої продукту не буде.

  ## Асоціація не працює. Двічі

  Гільдія незалежних театрів України з'явилася 2018 року — і саме вона замовила те дослідження, рекомендації якого досі не виконано. Про асоціацію Порицька каже, що була присутня і при її створенні, і при, за її словами, травматичному й нищівному завершенні.

  Левчук-Нетецький: «Вона існувала здебільшого фіктивно, бо навіть якщо ти дотичний до неї, ти з цього нічого не маєш».

  Я не бачу сенсу зараз створювати третю. Щоб така структура працювала, за нею має стояти штат і бюджет. Інакше ми отримаємо ще один список членів без наслідків.

  Він же сформулював альтернативу:

  «Якби в мене хоч хтось був, досвідчена людина, яка просто пояснила б найдурніше питання, — мій театр на початках стільки помилок не пережив би. Чи можемо ми створити спільноту, не асоціацію?»

  Можливо, саме тут ми нарешті назвали те, що зазвичай ховаємо за словом «безгрошів'я»: у нас майже немає інфраструктури взаємодії. Способу дізнатися, що твою проблему хтось вирішив два міста тому.

  ## Ми вже маємо ресурси

  На панелі прозвучали речі, які не потребують ні статуту, ні реєстрації.

  «Гармидер» із січня запускає з театром «Зміни» форум-театр про внутрішні конфлікти колективів і пропонує ділитися результатами. «Лава» будує у Львові спільну сцену для різних акторських курсів і хоче приймати театри з інших міст. Іванес запропонувала писати гранти спільно. Левчук-Нетецький — горизонтальне менторство.

  І чотири питання, які я поставив зі сцени й на які досі немає причини відповідати «ні». Чому ми не можемо разом спродюсувати чийсь показ у Києві. Чому «Лава» не може дати майданчик у Львові. Чому «Гармидер» не може прийняти когось на резиденцію. Чому кожна нова команда проходить наосліп те, що хтось уже пройшов.

  Ми справді говорили не про те.

  Не тому, що гроші, майданчики, виснаження чи відсутність системи — не проблеми. Вони проблеми. Але якщо через вісім років ми все ще можемо відтворити той самий список, а рекомендації, написані для нас же, лежать невиконаними, — можливо, настав час перестати цей список просто повторювати.

  Питання вже не тільки в тому, чого нам бракує. Питання в тому, чому ми досі не використовуємо те, що вже є одне в одного.

  Наступного разу я хочу почути за цим столом не список того, чого нам бракує, а список того, що ми вже зробили одне для одного.
body_en: |
  On the seventh of August, independent theatres from four cities sat down at one table in Kyiv for the first time: from Lutsk, Kharkiv, Lviv, and two from Kyiv. I was moderating, and I opened with a question: name two or three key problems in your work.

  I could have written the answers myself without leaving home. Isolation. No money. No venues. No system. Exhaustion.

  In 2018 the Guild of Independent Theatres of Ukraine commissioned a study, “Ukrainian Theatre: The Way to Itself”. It was carried out by the NGO Cultural Assembly with support from the Ukrainian Cultural Foundation, and it is still the most complete description of the field that the sector has ever commissioned for itself. It already states that no private theatre in Ukraine has a building of its own. It already makes recommendations: create open venues and theatre clusters, pass legislation so that state theatres hand their stages to independents on their dark days, build a network of housing for touring companies.

  Eight years, a pandemic and a full-scale invasion have passed since then. None of it has been done. And the list I heard at that table is the same list.

  The problem isn’t the people who answered. The problem is the question. I asked them to name what was missing, and I got exactly what I asked for. We had gathered to talk about isolation and we reproduced it: each of us named our own shortage, and nobody asked the person next to them what they were doing about theirs.

  ## The Philosophy of Poverty

  Ruslana Porytska, Harmyder theatre, Lutsk:

  “We’ve all got used to the philosophy of poverty, the idea that theatre has to be poor. And we’re broadcasting it even now, at this table.”

  Nobody picked it up. Me included.

  If she is right, our list isn’t a diagnosis, it’s a habit. A way of describing ourselves, learnt by heart over the years when there was no other way. Scarcity stopped being a circumstance and became a lens: we lived with shortage for so long that we started thinking through it. And then the question is no longer why there is no money, but why we have learnt to prove our authenticity by not having it. As if management were suspect. As if earning money from culture were a small betrayal of art.

  “People often tell me I project too much success-story success, when in reality everything is much more complicated,” says Porytska.

  Hangar in Lutsk began with ten thousand dollars won in a competition, which was enough for a floor and one entrance. They put in a yellow door, invited the city to take photos in front of it and launched a crowdfunding campaign. Today the theatre runs a workshop for one hundred and fifteen children, and that is what lets part of the team work only in theatre instead of in a warehouse.

  “We have to learn to think of our theatre as a business model. And then we have to take responsibility: learn to register as sole traders, pay taxes, report honestly.”

  ## Two Realities

  Anastasiia Ivanes, Lava theatre, Lviv:

  “Hunger, no money and total exhaustion. Those are the three pillars of having your own theatre.”

  They didn’t bring back a three-hour show because it is impossible to gather thirteen people who each have two jobs. “Because they all want to eat, they all want somewhere to sleep.”

  “Is my theatre really worth it, working in a warehouse or a kindergarten and then spending my only day off making a three-hour show?”

  One reality doesn’t cancel the other. Independent theatre in Ukraine lives in both at once.

  Harmyder has twenty-two years of work behind it and a reputation that allowed it to gather a city around itself. Lava has its second season and people who physically cannot come to rehearsal because they have two jobs. There is no ready-made road between these two points. And nobody hands one on to those who come next.

  ## Competition Was Built into Our Training

  Romana Isabella Soutus, NASHi Experimental Theatre Club:

  “Many institutions taught artists long ago that there is a very small, limited number of spectators. If those spectators go to someone else, they don’t come to you.”

  “This competition is created back at school, because actors are told that they are each other’s competitors. Then it carries over into directing.”

  Valerii Levchuk-Netetskyi, Khymery theatre, Kharkiv: “When you and your actor don’t work on a role as co-creators, but fight each other over it.”

  In recent months I keep hearing from friends in other art forms that the performing arts sector is the most toxic in Ukraine. It’s hard to argue.

  But there is a simple arithmetic mistake here. Independent theatres don’t share one audience. Their common resource is the people who don’t go to independent theatre at all yet. If someone goes to Harmyder in Lutsk for the first time, that raises the odds for Lava in Lviv and Khymery in Kharkiv.

  We don’t divide the audience. We create it.

  Competing in a sector this small isn’t an ethical mistake. It’s a management one.

  Soutus: “There are a lot of people working in theatre who don’t love theatre. They love themselves.”

  ## Half the Room

  Of the more than two hundred and fifty people there, about half don’t work in theatre professionally. Soutus turned to them:

  “You have enormous power. A big reason why many of us have to take other jobs is that we can’t sell tickets. If the values we’re talking about here matter to you, supporting independent theatre is how you carry those values on.”

  She brought up La MaMa, the experimental theatre in New York where she has worked. It was founded in 1961 by Ellen Stewart, a designer at Saks Fifth Avenue with no theatre experience at all. The first venue was a basement in a tenement building, and for years Stewart paid the artists who worked there out of her designer’s salary.

  “The situation was the same one we’re in now. What changed? People realised they had to support each other.”

  Nobody handed them the infrastructure ready-made. It was built by the same people who then worked in it. Harmyder did the same with an industrial zone in Lutsk.

  It also moves the audience from the end of the chain to the middle. Not a consumer of a product, but part of a system without which there would be no product.

  ## The Association Doesn’t Work. Twice

  The Guild of Independent Theatres of Ukraine appeared in 2018, and it was the Guild that commissioned the study whose recommendations still haven’t been carried out. Porytska says she was there both when the association was created and at what she calls its traumatic and devastating end.

  Levchuk-Netetskyi: “It existed mostly on paper, because even if you were involved, you got nothing out of it.”

  I see no point in creating a third one now. For a structure like that to work, it needs staff and a budget behind it. Otherwise we’ll get one more list of members with no consequences.

  He was also the one who put the alternative into words:

  “If I’d had anyone at all, an experienced person who would just explain the most stupid question, my theatre wouldn’t have gone through so many mistakes at the start. Can we create a community, not an association?”

  Maybe this is where we finally named what we usually hide behind the words “no money”: we have almost no infrastructure for working together. No way of finding out that someone two cities away has already solved your problem.

  ## We Already Have Resources

  The panel produced things that need neither a charter nor a registration.

  From January, Harmyder is launching a forum theatre with Zminy theatre about internal conflicts in companies, and offers to share the results. Lava is building a shared stage in Lviv for different acting courses and wants to host theatres from other cities. Ivanes proposed writing grant applications together. Levchuk-Netetskyi proposed horizontal mentoring.

  And there are four questions I asked from the stage, to which there is still no reason to say no. Why can’t we co-produce someone’s showing in Kyiv together? Why can’t Lava offer a venue in Lviv? Why can’t Harmyder host someone for a residency? Why does every new team go blindly through what someone else has already been through?

  We really were talking about the wrong things.

  Not because money, venues, exhaustion or the lack of a system aren’t problems. They are problems. But if eight years on we can still reproduce the same list, while recommendations written for us lie unimplemented, maybe it’s time to stop simply repeating that list.

  The question is no longer only what we lack. The question is why we still don’t use what we already have in each other.

  Next time, I want to hear at this table not a list of what we lack, but a list of what we have already done for each other.
