title_uk: «Промова» — театральний маніфест про тишу, слово і суспільство, яке не чує
title_en: 'The Speech: a theatrical manifesto about silence, speech and a society that has stopped listening'
lead_uk: Незалежний театр «Бентеги» показує «Промову» в Малій Опері 12 листопада 2025 — постмодерну театральну провокацію про людей, які безупинно говорять, але розучилися чути.
lead_en: Bentegy Theatre shows The Speech at Mala Opera on 12 November 2025, a postmodern provocation about people who talk endlessly but have forgotten how to listen.
cover: /uploads/promova-2.jpg
production: promova-2025
body_uk: 'У час, коли навколо панує інформаційний шум, а справжній діалог стає розкішшю, незалежний театр «Бентеги» презентує виставу «Промова» — постмодерну театральну провокацію про людей, які безупинно говорять, але розучилися чути — себе й одне одного.


  Події вистави розгортаються у барі — метафізичному просторі, де герої застрягли в нескінченному циклі повторів, страхів і звичок. Тут кожен із них робить власний вибір: мовчати, говорити чи почути.


  > «Це вистава про нас — про суспільство, що навчилося не слухати», — каже режисер Павло Коваль.


  У центрі історії — троє людей, які шукають сенс у словах, що давно втратили вагу. Простір бару стає дзеркалом, у якому кожен глядач може впізнати себе.


  «Промова» — театральний маніфест про втомлене покоління, яке прагне чесності замість галасу.


  У ролях: Софія Баюн, Денис Адамський, Ігор Куриленко. Партнер показу — Експериментальний театральний клуб «НАШі».


  **Показ:** 12 листопада 2025, 19:00, Мала Опера (вул. Дегтярівська, 5, Київ).

  '
body_en: |
  At a time of constant information noise, when real dialogue has become a luxury, the independent Bentegy Theatre presents The Speech, a postmodern theatrical provocation about people who talk endlessly but have forgotten how to hear themselves and each other.

  The action unfolds in a bar, a metaphysical space where the characters are stuck in an endless cycle of repetitions, fears and habits. Here each of them makes a choice: to stay silent, to speak or to listen.

  > “This is a production about us, about a society that has learnt not to listen,” says director Pavlo Koval.

  At the centre of the story are three people searching for meaning in words that have long lost their weight. The bar becomes a mirror in which every member of the audience may recognise themselves.

  The Speech is a theatrical manifesto about a tired generation that wants honesty instead of noise.

  Cast: Sofiia Baiun, Denys Adamskyi, Ihor Kurylenko. Partner of the performance: NASHi Experimental Theatre Club.

  **Performance:** 12 November 2025, 19:00, Mala Opera (5 Dehtiarivska St., Kyiv).
