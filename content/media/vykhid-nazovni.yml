body_uk: |
  ## Я не збирався в Будапешт

  Чесно: цієї поїздки не було в жодному моєму плані.

  За півтора тижні до неї я був на Kosovo Theatre Showcase і познайомився там із Dániel Mayer. Буває такий контакт, коли за один вечір встигаєш проговорити пів життя й пів театру. У нас сталося саме так. А потім він сказав дуже просту річ: приїжджай, подивишся, що в нас відбувається.

  Я приїхав.

  Так я опинився на dunaPart7, платформі сучасного угорського перформативного мистецтва, яка тривала в Будапешті з 18 по 21 листопада. Про угорську незалежну сцену я знав приблизно нічого. Я їхав без очікувань, з однією цікавістю.

  Скажу головне одразу. Цьогорічний dunaPart страшенно мене здивував: якістю робіт, людьми, тим, як усе це тримається разом. А остання вистава, яку я побачив, «Екстазі» Якаба Тарноці в театрі Катона, мене просто добила. У найкращому сенсі цього слова.

  Заради неї я того ж ранку поміняв квитки й залишився ще на день. Найкраще рішення всієї подорожі.

  ## Шоукейс, а не фестиваль

  Спершу трохи контексту, бо без нього далі буде незрозуміло.

  dunaPart — це шоукейс. Куратори самі наголошують на різниці: це не панорама всієї сцени й не список «найкращого». Його справа — познайомити міжнародних гостей із новими поколіннями митців і допомогти роботам поїхати далі. Цього року шестеро кураторів — Judit Böröcz, Ádám Czirák, Noémi Herczog, Beatrix Kricsfalusi, Léna Szirmay-Kalos і Gábor Thury — відібрали 23 роботи з майже 150 заявок. Організовує платформу Trafó.

  І є річ, яку куратори кажуть уголос, і я поважаю їх за цю прямоту. Незалежний сектор Угорщини давно живе під тиском, а від попереднього dunaPart 2023 року цей тиск лише посилився. Операційне фінансування фактично висохло. Мистецьку освіту політично перепідпорядкували. Люди масово їдуть із країни або йдуть із професії. Куратори сподіваються, що політичні зміни принесуть справедливіший розподіл ресурсів, але на момент, коли вони писали передмову, цього ще не відчувалося.

  Майже 150 заявок на такому тлі — це вже висловлювання. Люди продовжують робити.

  Тепер про те, що побачив я.

  Відбір дуже різноспрямований. Я назвав би його спробою поєднати непоєднуване. І вона вдалася. Бо між усіма роботами, якими б різними вони були, тягнеться одна дуже тонка лінія: кожна у свій, кардинально інший спосіб торкається того, що зараз відбувається в країні.

  Буду чесним до кінця. Я бачив дуже дивні роботи. Бачив дуже нудні. Бачив дуже політичні. І це абсолютно окей.

  Я гість. Я дивлюся ззовні й напевно пропустив частину сенсів, які місцевий глядач зчитує за секунду. Тому жодних висновків про «угорську інтонацію» від мене не буде, для них треба побачити значно більше. Але одне я можу сказати впевнено: у Будапешті працює багато дійсно сильних художників і художниць. Для мене це стало дуже приємним відкриттям.

  ## У них є де працювати

  Я продюсер. Тому в чужому місті я дивлюся ще й на стіни.

  Блекбокси. Камерні зали. Індустріальні простори. Велика сцена міського театру. Усе це існує поруч і працює. У цьому Європа значно сильніша за нас з однієї простої причини: ці простори в неї є.

  Друге, що я забрав із собою, — одна розмова. Художня керівниця одного з міських театрів розповідала мені, як вони шукають молодих режисерів і як підтримують молодих акторів: школа, воркшопи, лекції. Вона говорила про це як про звичайну частину роботи. Мене вразила саме ця буденність.

  І третє. Я не побачив конкуренції між роботами. Узагалі. Люди приходять одне до одного в зал, глядачі відкриті, з тобою говорять.

  Тут я мушу повернутися додому. Я вже писав про це в тексті [«Філософія бідності»](/media/filosofiia-bidnosti/) й повторю: останні місяці я регулярно чую, що перформативний сектор — найтоксичніший в Україні. Сперечатися складно. Ми живемо в катастрофічній токсичності й досі поводимося так, ніби ділимо одного глядача. А ми його створюємо.

  Будапешт показав мені, що буває інакше. Навіть коли сектор під тиском. Можливо, особливо тоді.

  Я дуже хочу працювати з Угорщиною: спільні проєкти, обміни, копродукції. Після цих чотирьох днів я вже знаю, з ким і про що тут говорити.

  ## Entering the Limbo: Боже, а що ж далі?

  Мене забрало вже першого вечора.

  Entering the Limbo Марка Барти (Márk Bartha) та Емеше Цугорки (Emese Cuhorka) відбувається в Arzenal, і це чудове місце для такої роботи. Ти сідаєш прямо серед десяти музикантів і десяти танцівників. Є простір, звук і тіла навколо тебе.

  ![Entering the Limbo, Arzenal. Відео: Павло Коваль](/uploads/dunapart-entering-the-limbo.mp4)

  Звук тут фантастичний. Музика фантастична. Хореографія, пластичні рішення, те, як перформери існують у просторі, темпоритм усього цього — я просто сидів і в якийсь момент зрозумів, що вже давно є частиною якогось трансу.

  Це не вистава в звичному розумінні. Це більше перформанс. Ще точніше — ритуал. І весь час усередині сидить одне невгамовне передчуття: Боже, а що ж буде далі?

  Кілька слів про команду, бо вона на це заслуговує. Entering the Limbo — новий етап електроакустичного проєкту Барти Ensemble in Limbo, де музичний експеримент продовжується в рух. Барта відповідає за концепцію та музику, Цугорка за хореографію й костюми, обоє зазначені як творці. Кураторка Léna Szirmay-Kalos пише, що робота перетворює особисту втрату на спільний досвід, на сучасний ритуал.

  Слово «ритуал» я прочитав уже після. У залі я дійшов до нього сам.

  ## let's go japan with the kids: пронизливий хаос

  Якщо Entering the Limbo — це ритуал, то let's go japan with the kids — це хаос.

  Абсолютний хаос, який тобі страшенно подобається.

  Це робота компанії dollardaddy's (Dollár Papa Gyermekei). Її написали й поставили засновники компанії Емьоке Кіш-Вег (Emőke Kiss-Végh) і Тамаш Ердьог (Tamás Ördög), вони ж виходять на сцену. Самі автори називають її лекцією, сповіддю та розрахунком і кажуть, що це їхня найособистіша вистава. Вона про межу між роботою та приватним життям, про митців, які водночас є батьками, і про угорську культурну політику, яка стоїть за всім цим побутом.

  Але переказувати її марно. Форма тут така, що ти гадки не маєш, що буде далі. Може трапитися будь-що. І трапляється.

  Я сміявся як божевільний у фіналі. До того були екстремально драматичні моменти. Були моменти, через які люди виходили із залу. І при цьому вистава тебе не шокує. Вона тримає тебе максимально зібраним.

  ![let's go japan with the kids. Відео: Павло Коваль](/uploads/dunapart-lets-go-japan.mp4)

  У ній є одночасно легкість і максимальна стриманість, і я досі не розумію, як їм це вдалося. Ти смієшся. Ти напружуєшся. Ти дійсно хочеш знати, чим усе закінчиться.

  Того ж вечора я виставив сторіз і написав, що це геніально. Бо це дійсно було геніально.

  Поруч із авторами на сцені Éva Kerekes, Sándor Zsótér, Emese Cuhorka, Zsombor Kövesi, Lili Izsák і Máté Kalicz, а ще студенти другого й третього курсів акторського відділення Keleti István School of Arts. Критик HVG Bálint Kovács назвав виставу по-справжньому майстерною: попри брутальну простоту, перша половина, де подружжя просто сидить одне навпроти одного й говорить про свій побут, пробирає до мурашок.

  ## «Екстазі»: вистава, яка мене добила

  Субота, 21 листопада. Фестивальна програма для мене вже мала закінчитися, а я сиджу в залі театру імені Йожефа Катони (Katona József Színház) із переброньованими квитками додому.

  «Екстазі» (Extázis) — вистава Якаба Тарноці (Jakab Tarnóczi), написана ним разом із драматургинею Жофією Варгою (Zsófia Varga). Прем'єра відбулася 16 грудня 2023 року на великій сцені театру. Три з половиною години, два антракти, угорська мова з англійськими субтитрами.

  Три з половиною години. Я їх не помітив.

  Формально це одна довга домашня вечірка. Єдиного сюжету тут немає: з дрібних подій складається портрет настрою цілого покоління. Невпевненість, самотність, спроби дотягнутися одне до одного. І питання, чи можна взагалі втримати щастя надовго.

  Це моє покоління. Можливо, тому воно влучило так точно.

  ### Це не було грою

  Я не хочу хвалити акторську гру.

  Бо для мене це не було грою. Це було абсолютне існування в просторі. Молоді люди грають молодих людей, і кожен діалог, кожна реакція тут настільки живі, що ти перестаєш думати про театр. Ти просто підглядаєш за життям.

  ![«Екстазі», театр Катона. Відео: Павло Коваль](/uploads/dunapart-ecstasy-rooms.mp4)

  Імена треба назвати, усі тринадцять: Barna Bányai Kelemen, Bence Béres, István Dankó, Bernát Gloviczki, Balázs Jakab, Adél Jordán, Kata Kanyó, Benjámin Lengyel, Júlia Mentes, Nóra Trokán, Hanna Pálos, Dániel Pásztor і Zsófia Tóth.

  Мене просили назвати одну сцену, яка запам'яталася найбільше. Це дуже складно. Уся вистава — це течія. Вода, яка перетікає з однієї форми в іншу, і саме через це вона така цілісна. Хореографію створила Emese Cuhorka, та сама, що за три дні до того вводила мене в транс в Arzenal. Музику написали Levente Bencsik і Máté Hunyadi.

  ### Світ, зібраний як годинник

  Сценограф Botond Devich побудував на сцені гіперреалістичну квартиру: кухня, вітальня, спальня, ванна. Поруч — цілодобовий магазинчик. Справжні стіни. Це новостворений світ, який працює як пазл і як годинник.

  Частину кімнат із залу просто не видно. Їх ти бачиш лише на екранах: сценою ходять люди з двома камерами, і картинка йде наживо на вертикальні екрани, схожі на дисплеї смартфонів. Відео створили Marcell Török і Bálint Kovács, світло — Bence Bárány і Bertalan Tóth.

  ![Оператор із камерою в квартирі «Екстазі». Відео: Павло Коваль](/uploads/dunapart-ecstasy-camera.mp4)
  ![Вертикальний екран «Екстазі». Відео: Павло Коваль](/uploads/dunapart-ecstasy-screen.mp4)

  Камера тут працює на деталі. На міміку. На те, що я назвав би макроемоційним рівнем. І тут моє єдине чесне «але»: мені було складнувато. Хотілося спостерігати за всім одразу, ловити деталі на екранах і ще й встигати читати субтитри. Угорської я не знаю. Щось я точно втратив, і мені від цього шкода.

  І окремо про кольори. Костюми створила Ilka Giliga, і це насамперед про естетику. Про шалену естетику. Кольорами тут окреслено внутрішній світ, у якому ці люди існують, і всі його неписані правила. Це просто красиво. А ще це працює десь на рівні підсвідомості: ти починаєш за кольорами вибудовувати зв'язки між людьми, між людьми та простором.

  Можливо, мені здалося. Можливо, цього ніхто не закладав. Але для мене воно спрацювало саме так.

  ### Просто, нормально добре

  Одну сцену я все ж назву.

  У пам'яті лишився монолог про те, що нам, схоже, уже не вдається бути щасливими просто так. Без нічого. Угорський критик Imre Magyari теж виокремлює його як надзвичайно сильний: Донат (Balázs Jakab) каже Вері (Zsófia Tóth), що хотів би, аби було просто «нормально добре».

  Нормально добре. Я досі ходжу з цими двома словами.

  Алкоголь і речовини в цьому світі нікого не роблять щасливим надовго. І екстаз у назві — це водночас стан і таблетка.

  ### Суп, танець і відчинена сцена

  Сцена «Екстазі» відкрита для глядачів перед початком, в антрактах і після фіналу. У перервах я лишався в залі. У фіналі — піднявся.

  ![Антракт «Екстазі»: глядачі на сцені. Фото: Павло Коваль](/uploads/dunapart-ecstasy-interval.jpg)

  Прийом, якщо чесно, дуже простий. Актори варять суп прямо на сцені й пригощають глядачів. Кличуть танцювати. І все.

  Я їв прекрасний місо-суп. Я танцював. Я ходив кімнатами, які три з половиною години бачив тільки на екранах. І відчуття було дивне: ніби ти за лаштунками й бачиш щось секретне. А насправді все навпаки. Ніяких лаштунків немає. Тебе просто впустили в світ, який тільки-но збудували на твоїх очах, і дозволили в ньому лишитися.

  Кращого фіналу платформи я собі уявити не можу. Пізніше, на вечірці закриття, я познайомився з кількома акторами вистави, і це було окреме щастя.

  ### Про тур, якого, можливо, не буде

  Мені сумно, що «Екстазі» можна побачити тільки в Будапешті.

  Я продюсер і прекрасно розумію, чому так. Ціла квартира на сцені. Тринадцять акторів. Камери, екрани, звук, світло, велика технічна команда. Везти таке Європою неймовірно дорого. Можливо, неможливо дорого.

  Але чесно: якби це сталося, я був би неймовірно щасливий. Бо ця вистава дійсно того заслуговує.

  Дякую Якабові Тарноці, Жофії Варзі, Емеше Цугорці та кожній людині в цій команді. Ви зробили мою осінь.

  ## Навіщо театр

  Усі чотири дні в мені крутилося одне старе питання. Чи має право існувати мистецтво заради мистецтва? Чи мистецтво все ж мусить щось змінювати?

  Мистецтво заради мистецтва має право на існування. Я це визнаю.

  Але я на іншому боці.

  Театр для мене — це величезна машина соціальних трансформацій. Ми не просто смішимо аудиторію. І ми її не «виховуємо»: я не люблю це слово, не люблю розмов про те, що театр має формувати чиїсь смаки. Смаки — річ абсолютно індивідуальна, і ніхто нікому тут нічого не винен.

  У нас є інше. У нас є рушійна сила, якої немає більше ні в кого: підвести людину до критично важливої теми й запросити її бути частиною цього процесу. Тут і зараз. Разом із тими, хто на сцені.

  Цей принцип — найпрекрасніше, що існує в театрі.

  І саме його я відчув у Будапешті. Entering the Limbo садить тебе всередину ритуалу. let's go japan with the kids говорить із тобою голосом сповіді. «Екстазі» відчиняє сцену, наливає тобі супу й каже: лишайся. Три зовсім різні роботи, і кожна робить крок назовні, до людини в залі.

  У dunaPart цей принцип видно ще чіткіше, бо майже кожна робота програми у свій спосіб говорить про те, що відбувається з країною. Без гасел. Через форму, через тіло, через сміх, через чиюсь кухню.

  Я кажу це з конкретного місця. Я живу в Україні, у країні, де триває війна. І звідти дуже добре видно, наскільки критично важливо продовжувати ту культурну роботу, яку ми всі робимо. Часи самі зняли питання, чи театр на щось впливає. Лишилося питання, чи вистачить нам сил.

  Тому найбільше, що я везу з Будапешта, — це відчуття, що сил вистачає. У них. Попри все, що куратори чесно перелічили у своїй передмові. Я надзвичайно щасливий, що кожна й кожен із цих людей знаходить у собі сили продовжувати.

  А ще це було чотири дні розмов. Із колегами з інших країн. З акторами. З місцевими перформерами. З художніми керівниками театрів. Я слухав чужий контекст і потроху розповідав свій. Це дуже маленька репрезентація України, на рівні одного діалогу за кавою. Але я дедалі більше вірю, що саме з таких діалогів усе й складається.

  Я хочу сюди повернутися. І хочу працювати з Угорщиною: привозити, вивозити, робити разом.

  ## Дякую

  Дякую команді dunaPart і Trafó за те, що це відбулося й було зроблено з такою увагою до гостей.

  Дякую кураторам — Judit Böröcz, Ádám Czirák, Noémi Herczog, Beatrix Kricsfalusi, Léna Szirmay-Kalos і Gábor Thury — за сміливий відбір і за чесність у розмові про власний контекст.

  Дякую всім митцям і мисткиням програми. Тим, чиї роботи мене захопили, і тим, чиї лишилися для мене загадкою.

  Дякую командам майданчиків, технічним службам, людям, які перекладали, зустрічали, пояснювали й відповідали на мої нескінченні питання.

  Дякую всім, із ким ми говорили в ці дні.

  Дякую Dániel Mayer. За запрошення, з якого все почалося.

  І ще раз дякую команді «Екстазі». Якщо ця вистава колись поїде Європою, я буду в залі. У будь-якому місті.

body_en: |
  ## I wasn't planning on Budapest

  Honestly: this trip was not in any plan of mine.

  A week and a half before it I was at the Kosovo Theatre Showcase, where I met Dániel Mayer. Sometimes you click with a person so fast that in one evening you talk through half a life and half of theatre. That is what happened to us. And then he said a very simple thing: come over, see what's going on here.

  I came.

  That is how I ended up at dunaPart7, the platform of Hungarian contemporary performing arts, held in Budapest from 18 to 21 November. I knew roughly nothing about the Hungarian independent scene. I arrived with no expectations, only curiosity.

  Let me say the main thing right away. This year's dunaPart surprised me enormously: the quality of the work, the people, the way it all holds together. And the last show I saw, Jakab Tarnóczi's Ecstasy at the Katona József Theatre, simply finished me off. In the best sense of the word.

  For that show I changed my tickets the same morning and stayed one more day. The best decision of the whole journey.

  ## A showcase, not a festival

  A little context first, because the rest won't make sense without it.

  dunaPart is a showcase. The curators stress the difference themselves: it is not a panorama of the whole scene and not a "best of" list. Its job is to introduce international guests to new generations of artists and to help the work travel. This year six curators — Judit Böröcz, Ádám Czirák, Noémi Herczog, Beatrix Kricsfalusi, Léna Szirmay-Kalos and Gábor Thury — selected 23 productions from nearly 150 entries. The platform is organised by Trafó.

  And there is something the curators say out loud, and I respect them for that directness. Hungary's independent sector has long lived under pressure, and since the previous dunaPart in 2023 that pressure has only grown. Operational funding has effectively dried up. Arts education has been taken over politically. People are leaving the country, or leaving the profession, in large numbers. The curators hope political change will bring a fairer distribution of resources, but at the time they wrote their foreword none of that could be felt yet.

  Nearly 150 entries against that background is already a statement. People keep making work.

  Now to what I saw.

  The selection pulls in many directions at once. I would call it an attempt to combine the uncombinable. And it worked. Because between all these pieces, however different they are, runs one very thin line: each of them, in its own radically different way, touches what is happening in the country right now.

  Let me be honest all the way. I saw some very strange work. Some very boring work. Some very political work. And that is absolutely okay.

  I am a guest. I look from the outside, and I certainly missed meanings that a local spectator reads in a second. So you will get no conclusions about a "Hungarian intonation" from me; for that I would need to see far more. But one thing I can say with confidence: there are a lot of truly strong artists working in Budapest. For me that was a very happy discovery.

  ## They have somewhere to work

  I am a producer. So in a foreign city I also look at the walls.

  Black boxes. Studio spaces. Industrial halls. The main stage of a city theatre. All of it exists side by side, and all of it works. In this, Europe is far stronger than we are, for one simple reason: it has these spaces.

  The second thing I took with me is one conversation. The artistic director of one of the city theatres told me how they look for young directors and how they support young actors: a school, workshops, lectures. She spoke about it as an ordinary part of the job. It was exactly that ordinariness that struck me.

  And the third. I saw no competition between the works. None at all. People come to each other's shows, audiences are open, they talk to you.

  Here I have to go back home. I have already written about this in my text ["The Philosophy of Poverty"](/en/media/filosofiia-bidnosti/), and I will repeat it: over the last months I keep hearing that the performing arts sector is the most toxic one in Ukraine. It is hard to argue. We live in catastrophic toxicity and still behave as if we were dividing a single spectator between us. But we are the ones who create that spectator.

  Budapest showed me that it can be different. Even when a sector is under pressure. Maybe especially then.

  I very much want to work with Hungary: joint projects, exchanges, co-productions. After these four days I already know who to talk to here, and about what.

  ## Entering the Limbo: God, what comes next?

  It took me on the very first evening.

  Entering the Limbo by Márk Bartha and Emese Cuhorka happens at Arzenal, and it is a wonderful place for a work like this. You sit down right among ten musicians and ten dancers. There is space, sound, and bodies around you.

  ![Entering the Limbo, Arzenal. Video: Pavlo Koval](/uploads/dunapart-entering-the-limbo.mp4)

  The sound is fantastic. The music is fantastic. The choreography, the physical solutions, the way the performers exist in the space, the tempo and rhythm of the whole thing — I was just sitting there, and at some point I realised I had long been part of some kind of trance.

  This is not a show in the usual sense. It is more of a performance. More precisely, a ritual. And the whole time one restless feeling sits inside you: God, what is going to happen next?

  A few words about the team, because they deserve it. Entering the Limbo is a new stage of Bartha's electroacoustic project Ensemble in Limbo, where musical experiment extends into movement. Bartha is responsible for the concept and the music, Cuhorka for the choreography and costumes, and both are credited as creators. Curator Léna Szirmay-Kalos writes that the work turns personal loss into a shared experience, a contemporary ritual.

  I read the word "ritual" only afterwards. In the room, I got there on my own.

  ## let's go japan with the kids: piercing chaos

  If Entering the Limbo is a ritual, then let's go japan with the kids is chaos.

  Absolute chaos, and you love it terribly.

  It is a work by the company dollardaddy's (Dollár Papa Gyermekei), written and directed by its founders Emőke Kiss-Végh and Tamás Ördög, who are also on stage. The authors themselves call it a lecture, a confession and a reckoning, and say it is their most personal performance. It is about the border between work and private life, about artists who are also parents, and about the Hungarian cultural politics standing behind all that everyday life.

  But retelling it is pointless. The form is such that you have no idea what comes next. Anything can happen. And it does.

  I laughed like a madman in the finale. Before that there were extremely dramatic moments. There were moments that made people walk out. And yet the show does not shock you. It keeps you as focused as you can be.

  ![let's go japan with the kids. Video: Pavlo Koval](/uploads/dunapart-lets-go-japan.mp4)

  It has lightness and extreme restraint at the same time, and I still don't understand how they pulled that off. You laugh. You tense up. You really want to know how it will all end.

  That same evening I posted a story saying it was genius. Because it really was genius.

  On stage alongside the authors are Éva Kerekes, Sándor Zsótér, Emese Cuhorka, Zsombor Kövesi, Lili Izsák and Máté Kalicz, together with second- and third-year acting students of the Keleti István School of Arts. HVG critic Bálint Kovács called the performance truly masterful: despite its brutal simplicity, the first half, in which the couple simply sit facing each other and talk about their everyday lives, is chilling.

  ## Ecstasy: the show that finished me off

  Saturday, 21 November. My festival programme was supposed to be over, and here I am, sitting in the auditorium of the Katona József Theatre (Katona József Színház) with rebooked tickets home.

  Ecstasy (Extázis) is directed by Jakab Tarnóczi, who wrote it together with dramaturg Zsófia Varga. It premiered on 16 December 2023 on the theatre's main stage. Three and a half hours, two intervals, in Hungarian with English subtitles.

  Three and a half hours. I did not notice them.

  Formally it is one long house party. There is no single plot: small events add up to a portrait of the mood of a whole generation. Insecurity, loneliness, attempts to reach one another. And the question of whether happiness can be held on to at all.

  It is my generation. Maybe that is why it hit so precisely.

  ### It was not acting

  I don't want to praise the acting.

  Because for me it was not acting. It was absolute existence in space. Young people play young people, and every dialogue, every reaction is so alive that you stop thinking about theatre. You are simply watching life through a keyhole.

  ![Ecstasy, Katona József Theatre. Video: Pavlo Koval](/uploads/dunapart-ecstasy-rooms.mp4)

  The names have to be said, all thirteen: Barna Bányai Kelemen, Bence Béres, István Dankó, Bernát Gloviczki, Balázs Jakab, Adél Jordán, Kata Kanyó, Benjámin Lengyel, Júlia Mentes, Nóra Trokán, Hanna Pálos, Dániel Pásztor and Zsófia Tóth.

  I was asked to name the one scene I remember most. That is very hard. The whole show is a current. Water flowing from one form into another, and that is exactly why it is so whole. The choreography is by Emese Cuhorka, the same artist who had put me into a trance at Arzenal three days earlier. The music was composed by Levente Bencsik and Máté Hunyadi.

  ### A world assembled like a clock

  Set designer Botond Devich built a hyper-realistic apartment on stage: kitchen, living room, bedroom, bathroom. Next to it, a 24-hour corner shop. Real walls. It is a newly made world that works like a puzzle and like a clock.

  Some of the rooms simply cannot be seen from the auditorium. You see them only on screens: people with two cameras move through the set, and the image goes live onto vertical screens that look like smartphone displays. Video is by Marcell Török and Bálint Kovács, lighting by Bence Bárány and Bertalan Tóth.

  ![A camera operator inside the Ecstasy apartment. Video: Pavlo Koval](/uploads/dunapart-ecstasy-camera.mp4)
  ![A vertical screen in Ecstasy. Video: Pavlo Koval](/uploads/dunapart-ecstasy-screen.mp4)

  The camera here works for detail. For the face. For what I would call the macro-emotional level. And here is my only honest "but": it was a little hard for me. I wanted to watch everything at once, catch the details on the screens and still manage to read the subtitles. I don't speak Hungarian. I certainly lost something, and I'm sorry about that.

  And separately, the colours. The costumes are by Ilka Giliga, and this is first of all about aesthetics. Wild aesthetics. Colour draws the inner world these people live in, and all its unwritten rules. It is simply beautiful. And it also works somewhere on a subconscious level: you start using colour to build connections between people, between people and the space.

  Maybe I imagined it. Maybe nobody intended it. But for me it worked exactly like that.

  ### Just normally good

  I will name one scene after all.

  What stayed with me is a monologue about how we seem no longer able to be happy just like that. Without anything. Hungarian critic Imre Magyari also singles it out as extremely strong: Donát (Balázs Jakab) tells Vera (Zsófia Tóth) that he wishes things could be just "normally good".

  Normally good. I am still walking around with those two words.

  Alcohol and substances make nobody in this world happy for long. And the ecstasy of the title is both a state and a pill.

  ### Soup, dancing and an open stage

  The stage of Ecstasy is open to the audience before the start, during the intervals and after the finale. During the intervals I stayed in my seat. At the finale, I went up.

  ![An interval at Ecstasy: the audience on stage. Photo: Pavlo Koval](/uploads/dunapart-ecstasy-interval.jpg)

  The device, honestly, is very simple. The actors cook soup right on stage and serve it to the audience. They invite you to dance. That's it.

  I ate a beautiful miso soup. I danced. I walked through rooms I had only seen on screens for three and a half hours. And the feeling was strange: as if you were backstage, seeing something secret. In fact it is the opposite. There is no backstage. You have simply been let into a world that was built in front of your eyes a moment ago, and allowed to stay in it.

  I cannot imagine a better ending to the platform. Later, at the closing party, I met several of the actors, and that was a happiness of its own.

  ### On a tour that may never happen

  It makes me sad that Ecstasy can only be seen in Budapest.

  I am a producer, and I understand perfectly well why. An entire apartment on stage. Thirteen actors. Cameras, screens, sound, light, a large technical team. Touring something like this across Europe is incredibly expensive. Maybe impossibly expensive.

  But honestly: if it happened, I would be incredibly happy. Because this show truly deserves it.

  Thank you to Jakab Tarnóczi, Zsófia Varga, Emese Cuhorka and every single person in this team. You made my autumn.

  ## What theatre is for

  For all four days one old question kept turning inside me. Does art for art's sake have a right to exist? Or does art have to change something after all?

  Art for art's sake has a right to exist. I admit that.

  But I am on the other side.

  For me, theatre is a huge machine of social transformation. We do not simply make the audience laugh. And we do not "educate" it: I dislike that word, I dislike the talk about theatre shaping somebody's taste. Taste is an absolutely individual thing, and nobody owes anybody anything here.

  We have something else. We have a driving force nobody else has: to bring a person up to a critically important subject and invite them to be part of that process. Here and now. Together with those who are on stage.

  That principle is the most beautiful thing that exists in theatre.

  And it is exactly what I felt in Budapest. Entering the Limbo seats you inside a ritual. let's go japan with the kids speaks to you in the voice of a confession. Ecstasy opens the stage, pours you some soup and says: stay. Three completely different works, and each of them takes a step outside, towards the person in the room.

  At dunaPart this principle is even clearer, because almost every work in the programme speaks, in its own way, about what is happening to the country. Without slogans. Through form, through the body, through laughter, through somebody's kitchen.

  I say this from a specific place. I live in Ukraine, a country where a war is going on. And from there you can see very well how critically important it is to keep doing the cultural work we all do. The times themselves have removed the question of whether theatre affects anything. What remains is the question of whether we have enough strength.

  So the biggest thing I am taking home from Budapest is the feeling that the strength is there. In them. Despite everything the curators honestly listed in their foreword. I am extremely happy that each and every one of these people finds the strength to continue.

  And it was also four days of conversations. With colleagues from other countries. With actors. With local performers. With artistic directors of theatres. I listened to someone else's context and, little by little, told mine. It is a very small representation of Ukraine, on the scale of one conversation over coffee. But I believe more and more that it is exactly from such conversations that everything is built.

  I want to come back here. And I want to work with Hungary: to bring work in, to take work out, to make things together.

  ## Thank you

  Thank you to the dunaPart and Trafó team for making this happen, and for doing it with such care for the guests.

  Thank you to the curators — Judit Böröcz, Ádám Czirák, Noémi Herczog, Beatrix Kricsfalusi, Léna Szirmay-Kalos and Gábor Thury — for a brave selection and for honesty in speaking about their own context.

  Thank you to all the artists in the programme. To those whose work captivated me, and to those whose work remained a riddle to me.

  Thank you to the venue teams, the technical crews, the people who translated, welcomed, explained and answered my endless questions.

  Thank you to everyone we talked with during these days.

  Thank you, Dániel Mayer. For the invitation it all started with.

  And once more, thank you to the team of Ecstasy. If this show ever travels across Europe, I will be in the audience. In any city.

